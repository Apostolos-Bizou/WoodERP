<style>

  .nav-item:hover{background:#33271a;color:var(--paper)}

  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:54px;flex:none;background:#fff;border-bottom:1px solid #E4DCCD;display:flex;align-items:center;gap:12px;padding:0 18px}
  .ham{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid #E4DCCD;background:#fff;cursor:pointer;color:#2C2318;flex:none;transition:.15s}
  .ham:hover{border-color:var(--teal);color:var(--teal)}
  .ham svg{width:18px;height:18px}
  .crumb{font-family:"Manrope";font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px}

  .sp{flex:1}
  .open{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;border:1px solid #E4DCCD;background:#fff;color:#2C2318;border-radius:9px;padding:8px 13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;text-transform:uppercase;letter-spacing:.03em}
  .open:hover{border-color:var(--teal);color:var(--teal)}
  .open svg{width:14px;height:14px}
  iframe{flex:1;border:0;width:100%;background:var(--paper)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(36,28,20,.45);z-index:35}
  @media(min-width:881px){ .app.collapsed .sidebar{width:0;border-right-color:transparent} }
  @media(max-width:880px){
    .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0)}
    .sidebar.open ~ .scrim{display:block}
  }
</style>

<style>
  :root{

    --walnut:#8A5A3B;--walnut-soft:#EFE3D8;--indigo:#43508C;--indigo-soft:#E3E5F1;--slate:#2F6C8F;--slate-soft:#DDEAF1;
    --green:#2E8B57;--green-soft:#DDEEE3;--green-bright:#14A058;--red:#C0492B;--red-soft:#F4DED6;

  .mono{font-family:"JetBrains Mono",monospace}

  .topline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .topline h1{font-family:"Manrope";font-weight:800;font-size:22px;margin:0}
  .topline .sub{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
  .topline .sp{flex:1}
  .search{position:relative;min-width:220px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
  .search input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px 9px 35px;font-family:"Inter";font-size:13px;outline:none;width:230px}
  .search input:focus{border-color:var(--teal)}
  .lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
  .lang button{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:7px;cursor:pointer}
  .lang button.on{background:var(--ink);color:var(--paper)}

  .hero{background:linear-gradient(120deg,var(--green-soft),var(--teal-soft));border:1px solid #BFE0D2;border-radius:18px;padding:26px 28px;margin-bottom:22px}
  .hero .tag{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--green);text-transform:uppercase}
  .hero h2{font-family:"Manrope";font-weight:800;font-size:30px;margin:8px 0 8px;color:#16433A;display:flex;align-items:center;gap:12px}
  .hero h2 svg{width:30px;height:30px;color:var(--green)}
  .hero p{margin:0;color:#2c5048;font-size:15px;max-width:680px}

  .chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}
  .chip{font-family:"Manrope";font-weight:700;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .chip:hover{border-color:var(--text)}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip svg{width:15px;height:15px;flex:none}
  .chip .dot{width:9px;height:9px;border-radius:99px;flex:none}

  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 28px;margin-bottom:18px}
  .panel h3{font-family:"Manrope";font-weight:800;font-size:21px;margin:0 0 6px;display:flex;align-items:center;gap:11px}
  .panel h3 .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
  .panel h3 .ic svg{width:19px;height:19px}
  .panel .intro{color:var(--muted);font-size:15px;margin:0 0 20px}
  .blk{padding:16px 0;border-top:1px solid var(--line)}
  .blk:first-of-type{border-top:0;padding-top:4px}
  .blk h4{font-family:"Manrope";font-weight:700;font-size:15.5px;margin:0 0 6px;display:flex;align-items:center;gap:9px}
  .blk h4 .n{width:22px;height:22px;border-radius:7px;background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;color:var(--muted);flex:none}
  .blk p{margin:0;color:var(--text);font-size:14px}
  .blk ul{margin:8px 0 0;padding-left:18px}
  .blk li{font-size:13.5px;margin-bottom:4px}
  .blk li b{font-family:"Manrope"}
  .tips{margin-top:20px;background:var(--amber-soft);border:1px solid #E7CFA8;border-radius:12px;padding:14px 16px}
  .tips .h{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .tips .h svg{width:14px;height:14px;flex:none}
  .tips ul{margin:0;padding-left:18px}
  .tips li{font-size:13.5px;margin-bottom:4px}

  .gloss{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:720px){.gloss{grid-template-columns:1fr}}
  .term{background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
  .term b{font-family:"Manrope";font-weight:700;font-size:14px;display:block;margin-bottom:3px}
  .term span{font-size:13px;color:var(--muted)}

  .scat{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
  .empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
</style>
</head>

<script>
const CATCOLOR={control:'var(--slate)',crm:'var(--teal)',order:'var(--walnut)',worker:'var(--amber)',roadmap:'var(--indigo)',concepts:'var(--green)',glossary:'var(--ink)'};
const CATICON={control:'g-grid',crm:'g-users',order:'g-paper',worker:'g-check',roadmap:'g-flow',concepts:'g-spark',glossary:'g-book'};

const GUIDE={
 el:{
  ui:{title:'Οδηγός Χρήσης',sub:'εγχειρίδιο πλατφόρμας · EL / EN',hsub:'Πλήρης οδηγός για κάθε οθόνη της πλατφόρμας. Διάλεξε κατηγορία παρακάτω.',search:'Αναζήτηση στον οδηγό…',tips:'Συμβουλές',inCat:'Κατηγορία',noRes:'Δεν βρέθηκε κάτι για την αναζήτηση.'},
  cats:[
   {id:'control',label:'Πύργος ελέγχου',title:'Πύργος ελέγχου',intro:'Δείχνει με μια ματιά όλες τις παραγγελίες της ημέρας και σε ποιο στάδιο βρίσκεται η καθεμία — σαν «πύργος ελέγχου» του εργοστασίου.',
     blocks:[
      {h:'Επιλογή περιόδου',p:'Πάνω αριστερά διαλέγεις Ώρα / Ημέρα / Εβδομάδα / Μήνας. Όλα τα νούμερα και η λίστα προσαρμόζονται στον όγκο της περιόδου.'},
      {h:'Κάρτες KPI',p:'Έξι βασικά νούμερα: Παραγγελίες, Σε εξέλιξη, Έτοιμες προς φόρτωση, Σε παράδοση/παραδόθηκαν, Καθυστερημένες, Προς είσπραξη.'},
      {h:'Pipeline σταδίων',p:'Δείχνει πόσες παραγγελίες κάθονται σε κάθε στάδιο (Καταχώρηση → Δρομολόγηση → Ετοιμασία → Φόρτωση → Παράδοση → Εξόφληση). Κλικ σε στάδιο φιλτράρει τη λίστα.'},
      {h:'Λίστα παραγγελιών',p:'Κάθε γραμμή έχει μπάρα πορείας, προορισμό(ούς), υπευθύνους, ETA και αξία. Κλικ σε παραγγελία ανοίγει αναλυτικά τη σταδιοποίησή της.'},
      {h:'Φόρτος ανά κτίριο & υπεύθυνο',p:'Κουμπιά (3ο/Τάσος, 5ο/Νίκος, Αυλή/Παναγιώτης, Αποθήκη/Γεωργία) που φιλτράρουν τη λίστα στις παραγγελίες του κτιρίου.'},
      {h:'Ειδοποιήσεις & καθυστερήσεις',p:'Καθυστερημένες παραγγελίες (κλικ ανοίγει τη σταδιοποίηση), εκκρεμή special orders και χαμηλό απόθεμα.'},
     ],
     tips:['Οι καθυστερημένες εμφανίζονται με κόκκινο.','Συνδυάζεις φίλτρα: π.χ. στάδιο «Φόρτωση» + κτίριο «5ο».','Με Esc κλείνει το παράθυρο σταδιοποίησης.']},
   {id:'crm',label:'Πελάτες (CRM)',title:'Πελάτες — CRM',intro:'Το πελατολόγιο, με μοναδικό κωδικό ανά πελάτη και μοναδικό σύνδεσμο παρακολούθησης ανά παραγγελία για το κινητό του πελάτη.',
     blocks:[
      {h:'KPI ως φίλτρα',p:'Τα πέντε νούμερα είναι κουμπιά: Πελάτες (όλοι), Επαγγελματίες, Με υπόλοιπο, Τζίρος (ταξινόμηση κατά αξία), Ενεργές παραγγελίες.'},
      {h:'Αναζήτηση & τύπος',p:'Ψάχνεις με όνομα, κωδικό, τηλέφωνο ή περιοχή και φιλτράρεις Όλοι / Επαγγελματίες / Ιδιώτες.'},
      {h:'Καρτέλα πελάτη',p:'Κλικ σε πελάτη ανοίγει ολόκληρη οθόνη με ενότητες: Επικοινωνία, Στοιχεία τιμολόγησης, Εμπορικοί όροι, Διευθύνσεις παράδοσης, σημειώσεις και όλες οι παραγγελίες με token παρακολούθησης.'},
      {h:'Στοιχεία τιμολόγησης',p:'Επωνυμία, Α.Φ.Μ., Δ.Ο.Υ., ΓΕΜΗ (για εταιρείες), διεύθυνση τιμολόγησης και τύπος παραστατικού (Τιμολόγιο / Απόδειξη).'},
      {h:'Διευθύνσεις παράδοσης (πολλαπλές)',p:'Ένας πελάτης μπορεί να έχει πολλές διευθύνσεις παράδοσης — π.χ. έδρα για τιμολόγηση και διαφορετικά εργοτάξια για παράδοση. Καθεμία έχει υπεύθυνο, τηλέφωνο, ζώνη, ώρες και οδηγίες· μία ορίζεται ως «κύρια».'},

let lang='el', cur=0;
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function icon(id){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#${id}"/></svg>`;}

function catHtml(c){
  let inner='';
  if(c.terms){
    inner=`<div class="gloss">${c.terms.map(t=>`<div class="term"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div>`;
  } else {
    inner=c.blocks.map((b,i)=>`<div class="blk"><h4><span class="n">${i+1}</span>${b.h}</h4><p>${b.p}</p>${b.items?`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`).join('');
    if(c.tips&&c.tips.length){
      inner+=`<div class="tips"><div class="h">${icon('g-tip')} ${GUIDE[lang].ui.tips}</div><ul>${c.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
    }
  }
  return `<div class="panel"><h3><span class="ic" style="background:${CATCOLOR[c.id]}">${icon(CATICON[c.id])}</span>${c.title}</h3><p class="intro">${c.intro}</p>${inner}</div>`;
}

function render(){
  const g=GUIDE[lang];const u=g.ui;
  $('#t-title').textContent=u.title;$('#t-sub').textContent=u.sub;
  $('#h-title').textContent=u.title;$('#h-sub').textContent=u.hsub;
  $('#q').placeholder=u.search;
  $('#chips').innerHTML=g.cats.map((c,i)=>`<button class="chip ${i===cur?'on':''}" onclick="pick(${i})"><span class="dot" style="background:${CATCOLOR[c.id]}"></span>${c.label}</button>`).join('');
  const q=$('#q').value.trim().toLowerCase();
  if(q){
    let out='';
    g.cats.forEach(c=>{
      const hit=[];
      if(c.blocks)c.blocks.forEach(b=>{if((b.h+' '+b.p).toLowerCase().includes(q))hit.push(`<div class="blk"><h4>${b.h}</h4><p>${b.p}</p></div>`);});
      if(c.terms)c.terms.forEach(t=>{if((t[0]+' '+t[1]).toLowerCase().includes(q))hit.push(`<div class="blk"><h4>${t[0]}</h4><p>${t[1]}</p></div>`);});
      if(c.intro.toLowerCase().includes(q)&&!hit.length)hit.push(`<div class="blk"><p>${c.intro}</p></div>`);
      if(hit.length)out+=`<div class="panel"><div class="scat">${u.inCat}: ${c.label}</div>${hit.join('')}</div>`;
    });
    $('#content').innerHTML=out||`<div class="panel"><div class="empty">${u.noRes}</div></div>`;
  } else {
    $('#content').innerHTML=catHtml(g.cats[cur]);
  }
}
function pick(i){cur=i;$('#q').value='';render();window.scrollTo({top:0,behavior:'smooth'});}
$$('#langSeg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;$$('#langSeg button').forEach(x=>x.classList.toggle('on',x===b));document.documentElement.lang=lang;render();});
render();

    position:sticky;top:0;z-index:50;
    background:rgba(36,28,20,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-dark);
    color:var(--paper);
  }
  .topbar .wrap{display:flex;align-items:center;gap:18px;height:56px}
  .topbar__brand{display:flex;align-items:center;gap:11px}
  .tb-mark{width:30px;height:30px;flex:none;display:block;border-radius:6px}
  .tb-name{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-weight:700;font-size:17px;color:var(--paper);letter-spacing:.3px;line-height:1}
  .tb-tag{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--amber);border-left:1px solid var(--line-dark);padding-left:11px;text-transform:uppercase}
  .topbar__spacer{flex:1}
  .topbar__prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted-ink)}
  .topbar__bar{width:120px;height:6px;border-radius:99px;background:#3a2e20;overflow:hidden}
  .topbar__bar i{display:block;height:100%;width:28%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:99px}
  .btn-print{
    font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.04em;
    color:var(--paper);background:transparent;border:1px solid var(--line-dark);
    padding:7px 12px;border-radius:9px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;text-transform:uppercase;
    transition:background .2s,border-color .2s;
  }
  .btn-print:hover{background:#352a1c;border-color:var(--amber)}

  /* ---------- hero (terminal) ---------- */
  .hero{
    background:
      radial-gradient(900px 380px at 82% -10%, rgba(185,118,42,.20), transparent 60%),
      radial-gradient(700px 420px at 8% 110%, rgba(31,111,107,.22), transparent 60%),
      var(--ink);
    color:var(--paper);
    border-bottom:1px solid var(--line-dark);
    overflow:hidden;
  }
  .hero .wrap{padding-top:64px;padding-bottom:56px}
  .eyebrow{
    font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--amber);display:flex;align-items:center;gap:10px;margin-bottom:22px;
  }
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--amber)}
  h1.hero__title{
    font-family:"Manrope";font-weight:800;letter-spacing:-.025em;line-height:1.02;
    font-size:clamp(34px,6vw,60px);margin:0 0 18px;
  }
  h1.hero__title span{color:var(--amber)}
  .hero__sub{font-size:clamp(15px,2vw,18px);color:#D9CDB8;max-width:640px;margin:0}
  .hero__meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
  .chip{
    font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;
    padding:7px 12px;border-radius:99px;border:1px solid var(--line-dark);
    background:rgba(255,255,255,.04);color:#E7DCC8;display:inline-flex;gap:8px;align-items:center;
  }
  .chip svg{width:14px;height:14px}

  /* terminal strip */
  .terminal{
    margin-top:38px;border:1px solid var(--line-dark);border-radius:var(--radius);
    background:linear-gradient(180deg, rgba(20,15,9,.6), rgba(20,15,9,.25));
    box-shadow:var(--shadow-lg);overflow:hidden;
  }
  .terminal__bar{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line-dark);background:rgba(0,0,0,.25)}
  .dot{width:11px;height:11px;border-radius:99px;background:#6b5740}
  .dot.r{background:#C0492B}.dot.y{background:#B9762A}.dot.g{background:#2E8B57}
  .terminal__title{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted-ink);margin-left:8px;letter-spacing:.05em}
  .terminal__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-dark)}
  .tstat{background:var(--ink-2);padding:18px 18px 16px}
  .tstat__k{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-ink)}
  .tstat__v{font-family:"Manrope";font-weight:800;font-size:26px;margin-top:6px;letter-spacing:-.02em}
  .tstat__v.teal{color:#5FD0C9}.tstat__v.amber{color:#E7A65A}.tstat__v.red{color:#E68B73}.tstat__v.paper{color:#F0E7D6}
  .tstat__n{font-size:12px;color:#9C8E78;margin-top:3px}

  /* ---------- generic section ---------- */
  section{padding:70px 0}
  .sec-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:34px}
  .sec-ic{
    flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;
    box-shadow:var(--shadow);
  }
  .sec-ic svg{width:24px;height:24px}
  .sec-num{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .sec-head h2{font-family:"Manrope";font-weight:800;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;margin:4px 0 0;line-height:1.1}
  .sec-head p{margin:8px 0 0;color:var(--muted);max-width:680px;font-size:15px}

  .alt{background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

  /* ---------- goal cards ---------- */
  .goals{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .goal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .goal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--teal))}
  .goal__ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--cs,var(--teal-soft));color:var(--c,var(--teal));margin-bottom:14px}
  .goal__ic svg{width:20px;height:20px}
  .goal h3{font-family:"Manrope";font-weight:700;font-size:16px;margin:0 0 6px;letter-spacing:-.01em}
  .goal p{margin:0;font-size:13.5px;color:var(--muted)}
  .goal .kpi{margin-top:14px;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;color:var(--c,var(--teal));display:flex;align-items:center;gap:7px}

  /* ---------- roadmap / gantt ---------- */
  .gantt{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .gantt__scroll{overflow-x:auto}
  .gantt__inner{min-width:760px}
  .gantt__months{display:grid;grid-template-columns:200px repeat(8,1fr);border-bottom:1px solid var(--line);background:var(--paper-2)}
  .gantt__months span{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);padding:11px 8px;text-align:center;letter-spacing:.04em;border-left:1px solid var(--line)}
  .gantt__months span:first-child{text-align:left;border-left:0;font-weight:700;color:var(--text)}
  .grow{display:grid;grid-template-columns:200px repeat(8,1fr);align-items:center;border-bottom:1px solid var(--line);position:relative}
  .grow:last-child{border-bottom:0}
  .glabel{padding:14px 14px;display:flex;flex-direction:column;gap:3px}
  .glabel b{font-family:"Manrope";font-weight:700;font-size:13.5px}
  .glabel small{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.03em}
  .gtrack{grid-column:2 / span 8;position:relative;height:100%;display:grid;grid-template-columns:repeat(8,1fr)}
  .gcell{border-left:1px solid var(--line)}
  .gbar{position:absolute;top:50%;transform:translateY(-50%);height:26px;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;box-shadow:var(--shadow)}
  .gbar.done{background:var(--teal)}
  .gbar.active{background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 7px,#a86824 7px,#a86824 14px)}
  .gbar.next{background:#C9BCA6;color:#5a4f3d}
  .gbar.build{background:var(--walnut)}
  .gbar.prod{background:var(--indigo)}
  .today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3}
  .today::after{content:"ΣΗΜΕΡΑ";position:absolute;top:-1px;left:5px;font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:700;color:var(--red);letter-spacing:.1em}

  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .sw{width:14px;height:10px;border-radius:3px;display:inline-block}

  /* roadmap progress table */
  .rtable{margin-top:26px;width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .rtable th,.rtable td{text-align:left;padding:13px 16px;font-size:13.5px;border-bottom:1px solid var(--line)}
  .rtable thead th{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--paper-2)}
  .rtable tbody tr:last-child td{border-bottom:0}
  .rtable td b{font-family:"Manrope";font-weight:700}
  .barwrap{display:flex;align-items:center;gap:10px;min-width:140px}
  .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1)}
  .pct{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;width:38px;text-align:right}

  /* ---------- problem table ---------- */
  .ptable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .ptable th,.ptable td{padding:15px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
  .ptable thead th{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--paper-2)}
  .ptable tbody tr:last-child td{border-bottom:0}
  .pid{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--walnut)}
  .ptable td b{font-family:"Manrope";font-weight:700;display:block;margin-bottom:3px}
  .sev{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase}
  .sev.high{background:var(--red-soft);color:var(--red)}
  .sev.med{background:var(--amber-soft);color:var(--amber)}

  /* ---------- persona / module grids ---------- */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .pcard__top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .pcard__ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--cs,var(--teal-soft));color:var(--c,var(--teal));flex:none}
  .pcard__ic svg{width:21px;height:21px}
  .pcard h3{font-family:"Manrope";font-weight:700;font-size:15px;margin:0;letter-spacing:-.01em}
  .pcard .role{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);margin-top:2px}
  .pcard ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
  .pcard ul li{margin:3px 0}

  .mnum{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;color:var(--c,var(--teal));letter-spacing:.05em}

  /* ---------- epics / user stories ---------- */
  .epic{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:22px;background:var(--card)}
  .epic__head{display:flex;align-items:center;gap:16px;padding:18px 22px;color:#fff;background:var(--c,var(--teal))}
  .epic__ic{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
  .epic__ic svg{width:22px;height:22px}
  .epic__t{flex:1}
  .epic__t .lbl{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;opacity:.85;text-transform:uppercase}
  .epic__t h3{font-family:"Manrope";font-weight:800;font-size:19px;margin:2px 0 0;letter-spacing:-.01em}
  .epic__prog{display:flex;flex-direction:column;gap:7px;min-width:190px}
  .epic__prog .row{display:flex;align-items:center;gap:9px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.04em}
  .epic__prog .row .lab{width:78px;opacity:.9}
  .epic__prog .pbar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
  .epic__prog .pbar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1)}
  .epic__start{padding:11px 22px;background:var(--paper-2);border-bottom:1px solid var(--line);font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:18px}
  .epic__start b{color:var(--text)}

  .stable{width:100%;border-collapse:collapse}
  .stable th,.stable td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
  .stable thead th{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#fff}
  .stable tbody tr:last-child td{border-bottom:0}
  .stable tbody tr:hover{background:var(--paper-2)}
  .sidc{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--c,var(--teal));white-space:nowrap}
  .ac{color:var(--muted);font-size:12.5px}
  .moscow{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;letter-spacing:.05em;white-space:nowrap}
  .m-M{background:var(--red-soft);color:var(--red)}
  .m-S{background:var(--amber-soft);color:var(--amber)}
  .m-C{background:var(--teal-soft);color:var(--teal)}

  /* ---------- state machine ---------- */
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
  .state{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;padding:10px 14px;border-radius:9px;background:var(--ink);color:var(--paper);white-space:nowrap}
  .state.k{background:var(--teal)}
  .state.pay{background:var(--amber)}
  .state.done{background:var(--green)}
  .state.cancel{background:var(--red)}
  .arrow{color:var(--muted)}
  .flow-note{margin-top:16px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
  .flow-note svg{width:18px;height:18px;color:var(--amber);flex:none;margin-top:2px}

  /* ---------- data model + kpi ---------- */
  .dtable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .dtable th,.dtable td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  .dtable thead th{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--paper-2)}
  .dtable tbody tr:last-child td{border-bottom:0}
  .dtable .ent{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--indigo)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi-c{background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;border:1px solid var(--line-dark)}
  .kpi-c .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-ink)}
  .kpi-c .v{font-family:"Manrope";font-weight:800;font-size:24px;margin-top:8px;letter-spacing:-.02em;color:#F0E7D6}
  .kpi-c .v.teal{color:#5FD0C9}.kpi-c .v.amber{color:#E7A65A}

  /* ---------- mockup checklist ---------- */
  .checks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .check{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .check__n{font-family:"Manrope";font-weight:800;font-size:22px;color:var(--amber);flex:none;width:34px}
  .check h4{font-family:"Manrope";font-weight:700;font-size:14.5px;margin:0 0 4px}
  .check p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
  .check .meta{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);display:flex;gap:14px;align-items:center}

  /* ---------- open questions ---------- */
  .ql{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .ql li{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:16px 18px;display:flex;gap:13px;font-size:13.5px}
  .ql li .qn{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--amber);flex:none}

  /* change mgmt callout */
  .callout{background:linear-gradient(120deg,var(--ink),var(--ink-2));color:var(--paper);border-radius:var(--radius);padding:34px;box-shadow:var(--shadow-lg);border:1px solid var(--line-dark)}
  .callout .eyebrow{margin-bottom:14px}
  .callout h3{font-family:"Manrope";font-weight:800;font-size:22px;margin:0 0 14px;letter-spacing:-.01em}
  .callout ul{margin:0;padding-left:20px;color:#DCD0BB}
  .callout ul li{margin:8px 0}
  .callout b{color:#E7A65A}

  /* footer */
  footer{background:var(--ink);color:var(--muted-ink);border-top:1px solid var(--line-dark);padding:34px 0}
  footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
  .logo-plate{display:inline-flex;align-items:center;gap:16px;background:#fff;border-radius:14px;padding:14px 22px;box-shadow:var(--shadow-lg)}
  .logo-mark{width:60px;height:60px;flex:none;display:block}
  .logo-words{display:flex;flex-direction:column;line-height:1}
  .logo-name{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-weight:700;font-size:27px;color:#1b1b1b;letter-spacing:.4px}
  .logo-tag{font-family:"Inter",sans-serif;font-weight:600;font-size:8.5px;letter-spacing:.17em;color:#6f6f6f;margin-top:7px}
  .footer-meta{display:flex;flex-direction:column;gap:6px;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted-ink);text-align:right}
  .footer-meta b{color:var(--paper);font-family:"Manrope";font-weight:700}
  @media(max-width:560px){.footer-meta{text-align:left}.logo-name{font-size:23px}}

  /* responsive */
  @media (max-width:880px){
    .goals,.grid3,.kpis{grid-template-columns:1fr 1fr}
    .terminal__grid{grid-template-columns:1fr 1fr}
    .grid2,.checks,.ql{grid-template-columns:1fr}
    .epic__head{flex-wrap:wrap}
    .epic__prog{min-width:100%}
  }
  @media (max-width:560px){
    .goals,.grid3,.kpis,.terminal__grid{grid-template-columns:1fr}
    .topbar__brand .tb-name{font-size:14px}
    .topbar__brand .tb-tag{display:none}
    .wrap{padding:0 18px}
  }
  @media (prefers-reduced-motion:reduce){
    .bar i,.epic__prog .pbar i{transition:none!important}
    html{scroll-behavior:auto}
  }
  @media print{
    .topbar,.btn-print{display:none}
    body{background:#fff}
    section{padding:26px 0;break-inside:avoid}
    .hero .wrap{padding:30px 0}
    .epic,.gantt,.rtable,.ptable,.pcard,.goal,.kpi-c{break-inside:avoid}
    .bar i,.epic__prog .pbar i{transition:none!important}
  }

  /* icon defs hidden */
  .icons{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>
<body>

  <symbol id="i-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 9h18"/><circle cx="16.5" cy="13" r="1.3" fill="currentColor"/></symbol>

<script>
  // animate progress bars + epic bars + topbar on reveal
  (function(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function fill(el){
      var p = el.getAttribute('data-p') + '%';
      if(reduce){ el.style.width = p; return; }
      requestAnimationFrame(function(){ el.style.width = p; });
    }
    var targets = document.querySelectorAll('.bar i[data-p], .epic__prog .pbar i[data-p]');
    if(!('IntersectionObserver' in window)){
      targets.forEach(fill); return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ fill(e.target); io.unobserve(e.target); }
      });
    }, {threshold:.4});
    targets.forEach(function(t){ io.observe(t); });

    // topbar overall bar
    var tb = document.querySelector('.topbar__bar i');
    if(tb && !reduce){ tb.style.width='0'; setTimeout(function(){ tb.style.transition='width 1.1s cubic-bezier(.4,0,.2,1)'; tb.style.width='28%'; },200); }
  })();
<\/script>

<script>
const STAGES=[
 {k:'new',t:'Καταχώρηση',c:'var(--slate)',cs:'var(--slate-soft)'},
 {k:'routed',t:'Δρομολόγηση',c:'var(--indigo)',cs:'var(--indigo-soft)'},

 {k:'transit',t:'Παράδοση',c:'var(--teal)',cs:'var(--teal-soft)'},
 {k:'paid',t:'Εξόφληση',c:'var(--green)',cs:'var(--green-soft)'},

const BLD={'3ο κτίριο':{who:'Τάσος',color:'var(--walnut)'},'5ο κτίριο':{who:'Νίκος',color:'var(--teal)'},'Αυλή':{who:'Παναγιώτης',color:'var(--amber)'},'Αποθήκη':{who:'Γεωργία',color:'var(--indigo)'}};
// μία λίστα — κόβεται κατά περίοδο
const ORDERS=[
 {id:'418',cust:'Μπελίνης Γιάννης',dest:['Βασιλική','Βόνιτσα'],blds:['3ο κτίριο','Αυλή','5ο κτίριο'],stage:2,val:6850,eta:'14:00',late:false},
 {id:'419',cust:'Σταματέλος Νίκος',dest:['Άγιος Νικήτας'],blds:['3ο κτίριο','5ο κτίριο'],stage:1,val:4180,eta:'16:30',late:false},
 {id:'420',cust:'Βλάχος Α.Ε.',dest:['Βόνιτσα'],blds:['3ο κτίριο','5ο κτίριο'],stage:0,val:9120,eta:'αύριο 09:00',late:false},
 {id:'421',cust:'Κατωπόδης Σπύρος',dest:['Λευκάδα'],blds:['Αποθήκη'],stage:5,val:120,eta:'παραδόθηκε',late:false},
 {id:'422',cust:'Γαζής Παναγιώτης',dest:['Βασιλική'],blds:['3ο κτίριο'],stage:4,val:2360,eta:'12:10',late:false},
 {id:'423',cust:'Περδικάρης Θ.',dest:['Νικιάνα'],blds:['5ο κτίριο','Αυλή'],stage:3,val:1540,eta:'11:30',late:true},
 {id:'424',cust:'Φίλιππας ΟΕ',dest:['Καρυά'],blds:['Αποθήκη','3ο κτίριο'],stage:2,val:3275,eta:'15:45',late:false},
 {id:'425',cust:'Ρομποτής Δ.',dest:['Βασιλική','Λευκάδα'],blds:['Αυλή','5ο κτίριο'],stage:1,val:880,eta:'17:00',late:false},
 {id:'426',cust:'Κονιδάρης Α.',dest:['Βόνιτσα'],blds:['3ο κτίριο'],stage:4,val:5400,eta:'10:00',late:false},
 {id:'427',cust:'Βεργίνης Σ.',dest:['Άγιος Νικήτας'],blds:['5ο κτίριο'],stage:5,val:740,eta:'παραδόθηκε',late:false},
 {id:'428',cust:'Λάζαρης Κ.',dest:['Λευκάδα'],blds:['Αποθήκη'],stage:3,val:1990,eta:'13:20',late:false},
 {id:'429',cust:'Σκιαδαρέσης Ν.',dest:['Τσουκαλάδες'],blds:['3ο κτίριο','Αυλή'],stage:2,val:2110,eta:'16:00',late:true},
 {id:'430',cust:'Μαργέλης Β.',dest:['Βασιλική'],blds:['5ο κτίριο'],stage:5,val:3680,eta:'παραδόθηκε',late:false},
 {id:'431',cust:'Αραβανής Γ.',dest:['Βόνιτσα','Καρυά'],blds:['3ο κτίριο','5ο κτίριο','Αποθήκη'],stage:1,val:7250,eta:'αύριο 11:00',late:false},
];
const RANGE={hour:{n:3,note:'τελευταία ώρα · 12:00–13:00'},day:{n:8,note:'σήμερα · Παρ 13/06'},week:{n:12,note:'τρέχουσα εβδομάδα · 09–13/06'},month:{n:14,note:'Ιούνιος 2026'}};
let range='day', filter=null, bldFilter=null;
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const eur=n=>(n||0).toLocaleString('el-GR')+' €';

function data(){return ORDERS.slice(0,RANGE[range].n);}

function render(){
  const D=data();
  $('#rangeNote').textContent=RANGE[range].note+' · '+D.length+' παραγγελίες';
  // KPIs
  const active=D.filter(o=>o.stage<=2).length;

  const collect=D.filter(o=>o.stage>=4&&o.stage<5).reduce((s,o)=>s+o.val,0);
  const totalVal=D.reduce((s,o)=>s+o.val,0);
  const K=[
   {k:'Παραγγελίες',v:D.length,c:'var(--indigo)',s:RANGE[range].note.split(' · ')[0]},
   {k:'Σε εξέλιξη',v:active,c:'var(--amber)',cls:'amber',s:'καταχώρ./ετοιμασία'},
   {k:'Έτοιμες προς φόρτωση',v:ready,c:'var(--walnut)',s:'όλοι οι σταθμοί ✓'},
   {k:'Σε παράδοση / ✓',v:out,c:'var(--teal)',cls:'teal',s:'εν κινήσει ή παρεδόθη'},
   {k:'Καθυστερημένες',v:late,c:'var(--red)',cls:'red',s:'εκτός ETA'},
   {k:'Προς είσπραξη',v:eur(collect),c:'var(--green)',cls:'green',s:'αξία '+eur(totalVal)},

  const times=['09:05','09:40','10:25','11:10','12:30','13:15'];
  let steps='';
  for(let i=0;i<STAGES.length;i++){const s=STAGES[i];
    const state=i<o.stage?'done':(i===o.stage?(o.late?'late':'cur'):'todo');
    const note=state==='done'?('ολοκληρώθηκε · '+times[i]):state==='cur'?'σε εξέλιξη τώρα':state==='late'?('καθυστέρηση — από '+o.eta):'εκκρεμεί';
    steps+=`<div class="ostep ${state}" style="--c:${s.c}"><span class="mk">${state==='done'?'✓':''}</span><div class="lab"><b>${s.t}</b><small>${note}</small></div></div>`;
  }
  $('#odBody').innerHTML=`
    <div class="od-head">
      <div><div class="od-cust">${o.cust}</div><div class="od-no">Παρ. 2026-000${o.id}</div></div>
      <div class="od-val">${eur(o.val)}<small>${o.late?'καθυστέρηση':'ETA '+o.eta}</small></div>
    </div>
    <div class="od-meta">${dests}</div>
    <div class="od-resp">${avs}</div>
    <div class="od-steps">${steps}</div>`;
  $('#odModal').classList.add('show');
}
function closeOrder(){$('#odModal').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOrder();});
$$('#rangeSeg button').forEach(b=>b.onclick=()=>{range=b.dataset.r;filter=null;$$('#rangeSeg button').forEach(x=>x.classList.toggle('on',x===b));render();});
render();
<\/script>

</script>

  const q=$('#q').value.trim().toLowerCase();const t=typeFilter();
  if(t!=='all'&&c.type!==t)return false;
  if(!q)return true;
  return (c.name+' '+c.code+' '+c.phone+' '+c.area+' '+c.prof).toLowerCase().includes(q);
}
function activeOrders(c){return c.orders.filter(o=>o.stage<5).length;}
function pct(stage){return Math.round(stage/5*100);}
function stageColor(o){return o.late?'var(--red)':o.stage>=4?'var(--green)':o.stage>=3?'var(--walnut)':o.stage>=2?'var(--amber)':'var(--slate)';}

function showView(id){['viewList','viewCust','viewPhone','viewNew'].forEach(v=>{document.getElementById(v).hidden=(v!==id);});window.scrollTo(0,0);}
function showList(){showView('viewList');}
function backToCust(){showView('viewCust');}
function setType(t){$$('#typeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));}
function kpiClick(f){
  if(f==='all'){kpiFilter=null;setType('all');$('#q').value='';render();return;}
  if(f==='pro'){kpiFilter=null;setType('pro');render();return;}
  kpiFilter=(kpiFilter===f)?null:f;render();
}

function render(){
  let list=CUSTOMERS.filter(matches);
  if(kpiFilter==='bal') list=list.filter(c=>c.balance<0);
  else if(kpiFilter==='active') list=list.filter(c=>activeOrders(c)>0);
  else if(kpiFilter==='turnover') list=[...list].sort((a,b)=>turn(b)-turn(a));
  const total=CUSTOMERS.length;
  const pro=CUSTOMERS.filter(c=>c.type==='pro').length;
  const withBal=CUSTOMERS.filter(c=>c.balance<0).length;
  const turnover=CUSTOMERS.reduce((s,c)=>s+c.orders.reduce((a,o)=>a+o.val,0),0);
  const act=CUSTOMERS.reduce((s,c)=>s+activeOrders(c),0);
  const tf=typeFilter();
  const K=[
   {k:'Πελάτες',v:total,c:'var(--indigo)',s:'όλοι · καθαρισμός',f:'all',active:(kpiFilter===null&&tf==='all')},
   {k:'Επαγγελματίες',v:pro,c:'var(--teal)',s:(total-pro)+' ιδιώτες',f:'pro',active:(tf==='pro'&&kpiFilter===null)},
   {k:'Με υπόλοιπο',v:withBal,c:'var(--red)',s:'ανοιχτοί λογ/σμοί',f:'bal',active:(kpiFilter==='bal')},
   {k:'Τζίρος',v:eur(turnover),c:'var(--green)',s:'ταξινόμηση κατά αξία ↓',f:'turnover',active:(kpiFilter==='turnover')},
   {k:'Ενεργές παραγγελίες',v:act,c:'var(--amber)',s:'σε εξέλιξη τώρα',f:'active',active:(kpiFilter==='active')},
  ];
  $('#kpis').innerHTML=K.map(x=>`<div class="kpi${x.active?' active':''}" style="--c:${x.c}" onclick="kpiClick('${x.f}')"><div class="k">${x.k}</div><div class="v">${x.v}</div><div class="s">${x.s}</div></div>`).join('');
  $('#rows').innerHTML=list.map(c=>{
    const i=CUSTOMERS.indexOf(c);const a=activeOrders(c);
    return `<tr onclick="showCust(${i})">
      <td><span class="ccode">${c.code}</span></td>
      <td class="cname"><b>${c.name}</b><small>${c.prof!=='—'?c.prof:'Ιδιώτης'}</small></td>
      <td><span class="badge ${c.type==='pro'?'pro':'idi'}">${c.type==='pro'?'Επαγγελματίας':'Ιδιώτης'}</span></td>
      <td>${c.area}</td>
      <td class="mono" style="font-size:12px">${c.phone}</td>
      <td><span class="ordn"><b>${c.orders.length}</b> σύν. ${a?`· <span style="color:var(--amber)">${a} ενεργές</span>`:''}</span></td>
      <td class="bal ${c.balance<0?'neg':'zero'}">${c.balance<0?eur(c.balance):'—'}</td>
      <td style="text-align:right"><span class="arrow-c">›</span></td>
    </tr>`;
  }).join('')||`<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:30px">Κανένας πελάτης για «${$('#q').value}».</td></tr>`;
}

function addrLine(a){return [a.street,((a.postal?a.postal+' ':'')+(a.city||'')).trim()].filter(Boolean).join(', ');}
function kvRow(k,v){return v?`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`:'';}
function showCust(i){
  curCust=i;const c=CUSTOMERS[i];const b=c.billing,t=c.terms;
  $('#cTtl').textContent=c.name;
  $('#cSub').textContent=c.code+' · '+(c.type==='pro'?'Επαγγελματίας':'Ιδιώτης')+' · '+c.area;
  const contact=`<div class="sect"><div class="sec-title" style="margin-top:0">Επικοινωνία</div>
     ${kvRow('Κωδικός',`<span class="mono" style="color:var(--walnut);cursor:pointer" onclick="copy('${c.code}')">${c.code} ⧉</span>`)}
     ${kvRow('Τύπος',c.type==='pro'?'Επαγγελματίας':'Ιδιώτης')}
     ${kvRow('Δραστηριότητα',c.prof!=='—'?c.prof:'')}
     ${kvRow('Τηλέφωνο',`<a href="tel:${c.phone}">${c.phone}</a>`)}
     ${kvRow('Κινητό',c.mobile?`<a href="tel:${c.mobile}">${c.mobile}</a>`:'')}
     ${kvRow('Email',c.email?`<a href="mailto:${c.email}">${c.email}</a>`:'')}
   </div>`;
  const billing=`<div class="sect"><div class="sec-title" style="margin-top:0">Στοιχεία τιμολόγησης</div>
     ${kvRow('Επωνυμία',b.legalName)}
     ${kvRow('Α.Φ.Μ.',b.afm)}
     ${kvRow('Δ.Ο.Υ.',b.doy)}
     ${b.gemi?kvRow('ΓΕΜΗ',b.gemi):''}
     ${kvRow('Διεύθυνση',addrLine(b.addr)||'—')}
     ${kvRow('Παραστατικό',invLabel[b.invoiceType]||'—')}
   </div>`;
  const terms=`<div class="sect"><div class="sec-title" style="margin-top:0">Εμπορικοί όροι</div>
     ${kvRow('Τρόπος πληρωμής',payLabel[t.payment]||'—')}
     ${kvRow('Πιστωτικό όριο',t.creditLimit?eur(t.creditLimit):'—')}
     ${kvRow('Τιμοκατάλογος',t.priceList||'—')}
     ${kvRow('Έκπτωση',(t.discount||0)+'%')}
     ${kvRow('Υπόλοιπο',c.balance<0?`<span style="color:var(--red)">${eur(-c.balance)}</span>`:'0 €')}
   </div>`;
  const extra=`${c.tags&&c.tags.length?`<div class="tags">${c.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`:''}${c.notes?`<div class="notes">📝 ${c.notes}</div>`:''}`;
  const left=`<div>${contact}${billing}${terms}${extra}</div>`;

  const deliveries=`<div class="sect"><div class="sec-title" style="margin-top:0">Διευθύνσεις παράδοσης (${c.deliveries.length})</div>
     ${c.deliveries.map(d=>`<div class="ship">
        <div class="lab"><b>${d.label}</b>${d.primary?'<span class="primary-badge">κύρια</span>':''}</div>
        <div class="ad">${addrLine(d.addr)||'—'}</div>
        <div class="meta">${[d.name,d.phone,d.zone&&('ζώνη '+d.zone),d.hours].filter(Boolean).join(' · ')}</div>
        ${d.notes?`<div class="meta" style="color:var(--amber)">⚠ ${d.notes}</div>`:''}
     </div>`).join('')}
     <button class="mini" style="margin-top:4px" onclick="toast('Προσθήκη διεύθυνσης παράδοσης (mock)')"><svg><use href="#i-plus"/></svg> Νέα διεύθυνση</button>
   </div>`;
  const orders=`<div class="sec-title">Παραγγελίες &amp; σύνδεσμοι παρακολούθησης</div>
     ${c.orders.length?c.orders.map(o=>{
        const col=stageColor(o);
        const stt=o.stage>=5?(o.mode==='pickup'?'Παρελήφθη':'Παραδόθηκε'):o.late?'Καθυστέρηση':STAGES[o.stage];
        return `<div class="ocard">
          <div class="r1"><div class="oid">Παραγγελία<br><b>2026-000${o.id}</b> · ${o.date} · ${o.mode==='pickup'?'παραλαβή':'διανομή'}</div><div class="ov">${eur(o.val)}</div></div>
          <div class="token"><svg style="width:11px;height:11px"><use href="#i-link"/></svg> ${tok(o.id)}</div>
          <div class="pbar"><i style="width:${pct(o.stage)}%;background:${col}"></i></div>
          <div class="ostat" style="color:${col}">${o.late?'⚠ ':''}${stt} · ${pct(o.stage)}%</div>
          <div class="acts">
            <button class="mini go" onclick="showPhone('${o.id}')"><svg><use href="#i-phone"/></svg> Όψη πελάτη</button>
            <button class="mini" onclick="copy('https://stavrakas.eu/track/${tok(o.id)}')"><svg><use href="#i-link"/></svg> Σύνδεσμος</button>
            <button class="mini" onclick="toast('Άνοιγμα στο Δελτίο Παραγγελίας (mock)')"><svg><use href="#i-doc"/></svg> Δελτίο</button>
          </div>
        </div>`;
      }).join(''):'<div class="notes">Καμία παραγγελία ακόμη.</div>'}`;
  const right=`<div>${c.balance<0?`<div class="balance-card"><div class="l">Υπόλοιπο προς είσπραξη</div><div class="v">${eur(-c.balance)}</div></div>`:''}${deliveries}${orders}</div>`;
  $('#custBody').innerHTML=left+right;
  showView('viewCust');
}

function custSteps(o){
  if(o.mode==='pickup'){
    const steps=['Καταχωρήθηκε','Ετοιμάζεται','Έτοιμη για παραλαβή','Παρελήφθη'];
    const ci=o.stage<=1?0:o.stage===2?1:o.stage<=4?2:3;
    return {steps,ci,ready:ci===2};
  }
  const steps=['Καταχωρήθηκε','Ετοιμάζεται','Φορτώθηκε','Σε δρομολόγιο','Παραδόθηκε'];
  const ci=o.stage<=1?0:o.stage===2?1:o.stage===3?2:o.stage===4?3:4;
  return {steps,ci,ready:o.stage>=3&&o.stage<5};
}
function findOrder(id){for(const c of CUSTOMERS){const o=c.orders.find(x=>x.id===id);if(o)return{c,o};}return null;}

function showPhone(id){
  const f=findOrder(id);if(!f)return;const {c,o}=f;
  const cs=custSteps(o);const lastIdx=cs.steps.length-1;
  const isDone=cs.ci===lastIdx;const isReady=cs.ready;
  const prog=Math.round(cs.ci/lastIdx*100);
  let statCls=isReady?'ready':(o.late?'late':'');
  let icBg=isReady?'var(--green-soft)':o.late?'var(--red-soft)':'var(--amber-soft)';
  let icCol=isReady?'var(--green)':o.late?'var(--red)':'var(--amber)';
  let icSym=isDone||isReady?'i-check':(o.mode==='delivery'&&o.stage===4?'i-truck':'i-box');
  let lbl=cs.steps[cs.ci];
  let etaLine=isDone?`Ολοκληρώθηκε στις <b>${o.date}</b>`:isReady?(o.mode==='pickup'?`<b>Έλα να την παραλάβεις!</b>`:`Φεύγει για παράδοση`):`Εκτιμώμενη ετοιμότητα: <b>σήμερα ${o.eta}</b>`;
  if(o.late)etaLine=`Καθυστέρηση — νέα εκτίμηση <b>${o.eta}</b>`;
  let stepsHtml='';
  cs.steps.forEach((s,i)=>{const st=i<cs.ci?'done':i===cs.ci?'cur':'todo';
    stepsHtml+=`<div class="cstep ${st}"><span class="mk">${i<cs.ci?'✓':''}</span><div class="cl"><b>${s}</b><small>${i<cs.ci?'ολοκληρώθηκε':i===cs.ci?'τώρα':'σε αναμονή'}</small></div></div>`;});
  let pick;
  if(o.mode==='pickup'){
    pick=`<div class="pickbox"><svg><use href="#i-pin"/></svg><div style="flex:1">
      <a class="maps-link" href="${FACTORY_MAPS}" target="_blank" rel="noopener">
        <b>Παραλαβή από το εργοστάσιο</b><br>Μεγάλη Βρύση, Λευκάδα 31100<br>
        <span class="maps-cta"><svg><use href="#i-map"/></svg> Οδηγίες στο Google Maps →</span>
      </a>
      <div style="margin-top:8px"><small class="mono">Ρώτησε για: ${BLD[o.bld]} · ${o.bld}</small><br><small class="mono">Ωράριο: 07:30–15:00 &amp; 17:30–20:30</small></div>
    </div></div>`;
  } else {
    pick=`<div class="pickbox"><svg><use href="#i-truck"/></svg><div><b>Διανομή με όχημα Σταύρακας</b><br>Προς: ${c.area}<br><small class="mono">${o.stage>=4?'Εκτ. άφιξη σήμερα '+o.eta:'Θα φύγει μόλις ετοιμαστεί'}</small></div></div>`;
  }
  const items=o.items.map(it=>`<div class="items-row"><span>${it[0]}</span><b>${it[1]}</b></div>`).join('');
  const mapBtn=o.mode==='pickup'?`<a href="${FACTORY_MAPS}" target="_blank" rel="noopener"><svg><use href="#i-map"/></svg> Χάρτης</a>`:'';
  $('#phoneScreen').innerHTML=`
    <div class="notch"></div>
    <div class="cust-head">
      <div class="lg"><svg viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M31 41 L50 19 L69 41"/><path d="M26 58 L50 33 L74 58"/><path d="M22 73 L50 47 L78 73"/></g><rect x="45.5" y="69" width="9" height="17" rx="2" fill="#fff"/></svg></div>
      <h2>Σταύρακας Α.Ε.</h2><div class="t">ΠΑΡΑΚΟΛΟΥΘΗΣΗ ΠΑΡΑΓΓΕΛΙΑΣ</div>
    </div>
    <div class="cust-body">
      <div class="statusbig ${statCls}">
        <div class="ic" style="background:${icBg}"><svg style="color:${icCol}"><use href="#${icSym}"/></svg></div>
        <div class="lbl">${isReady&&o.mode==='pickup'?'Έτοιμη!':lbl}</div>
        <div class="eta">${etaLine}</div>
        <div class="pbig"><i style="width:${prog}%"></i></div>
        <div class="mono" style="font-size:10px;color:var(--muted)">${tok(o.id)} · ${c.name}</div>
      </div>
      <div class="cust-card"><h4>Πορεία παραγγελίας</h4>${stepsHtml}</div>
      <div class="cust-card"><h4>${o.mode==='pickup'?'Στοιχεία παραλαβής':'Στοιχεία παράδοσης'}</h4>${pick}</div>
      <div class="cust-card"><h4>Τι περιλαμβάνει</h4>${items}</div>
      <div class="cust-btns"><a class="call" href="tel:2645023317"><svg><use href="#i-phone"/></svg> Κάλεσέ μας</a>${mapBtn}</div>
      <button class="reorder" onclick="toast('Αίτημα επανάληψης παραγγελίας στάλθηκε (mock)')"><svg style="width:15px;height:15px"><use href="#i-repeat"/></svg> Επανάληψη ίδιας παραγγελίας</button>
      <div class="smsnote">📩 Θα λάβεις αυτόματο SMS/Viber μόλις η παραγγελία είναι έτοιμη.<br>Δεν χρειάζεται να τηλεφωνήσεις.</div>
    </div>
    <div class="cust-foot">stavrakas.eu/track · ασφαλής προσωπικός σύνδεσμος</div>`;
  const url='stavrakas.eu/track/'+tok(o.id);
  const sms=[
    {t:'Καταχωρήθηκε η παραγγελία σου',sub:o.date+' · αυτόματο',done:true},
    {t:'Μπήκε σε ετοιμασία',sub:'SMS',done:o.stage>=2},
    {t:(o.mode==='pickup'?'ΕΤΟΙΜΗ για παραλαβή':'Φορτώθηκε & φεύγει'),sub:'SMS + Viber',done:o.stage>=3},
    {t:(o.mode==='pickup'?'Παρελήφθη':'Παραδόθηκε'),sub:'επιβεβαίωση',done:o.stage>=5},
  ];
  $('#pmSide').innerHTML=`
    <div class="h"><h3>Σύνδεσμος πελάτη</h3><small>μοναδικός ανά παραγγελία</small></div>
    <div class="b">
      <div class="linkbox"><span class="u">${url}</span><button onclick="copy('https://${url}')"><svg style="width:11px;height:11px"><use href="#i-copy"/></svg> Copy</button></div>
      <div class="qrwrap">${qr(tok(o.id))}<div class="cap">Τυπώνεται πάνω στο δελτίο — ο πελάτης σκανάρει</div></div>
      <div class="sms-tl">
        <div class="sec-title" style="margin-top:0">Αυτόματες ειδοποιήσεις</div>
        ${sms.map(s=>`<div class="st ${s.done?'':'future'}"><span class="d"></span><div class="m">${s.t}<small>${s.sub}${s.done?' ✓':' · εκκρεμεί'}</small></div></div>`).join('')}
      </div>
    </div>`;
  showView('viewPhone');
}

function qr(seed){
  let h=0;for(let i=0;i<seed.length;i++)h=(h*131+seed.charCodeAt(i))>>>0;
  const N=21,cell=6;let rects='';
  function rnd(){h=(h*1103515245+12345)>>>0;return (h>>>16)/65536;}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const finder=(x<7&&y<7)||(x>=N-7&&y<7)||(x<7&&y>=N-7);let on;
    if(finder){const lx=x<7?x:x-(N-7),ly=y<7?y:y-(N-7);on=(lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4));}
    else on=rnd()>0.55;
    if(on)rects+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}"/>`;
  }
  const sz=N*cell;
  return `<svg viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg"><rect width="${sz}" height="${sz}" fill="#fff"/><g fill="#241C14">${rects}</g></svg>`;
}

function nextCode(){let mx=0;CUSTOMERS.forEach(c=>{const n=parseInt(c.code.split('-')[1],10);if(n>mx)mx=n;});return 'ΠΕΛ-'+String(mx+1).padStart(4,'0');}
function showNew(){
  $('#ncCode').textContent=nextCode();
  ['ncName','ncProf','ncPhone','ncMobile','ncEmail','ncAfm','ncDoy','ncGemi','ncBStreet','ncBCity','ncBPostal','ncDStreet','ncDCity','ncDPostal','ncDName','ncDPhone','ncDNotes','ncCredit','ncList','ncDisc','ncNotes'].forEach(id=>{const e=$('#'+id);if(e)e.value='';});
  $('#ncSame').checked=true;$('#ncDelWrap').style.display='none';
  showView('viewNew');
}
function ncSameToggle(){$('#ncDelWrap').style.display=$('#ncSame').checked?'none':'block';}
function val(id){const e=$('#'+id);return e?e.value.trim():'';}
function saveNew(){
  const name=val('ncName');if(!name){toast('Συμπλήρωσε όνομα / επωνυμία');return;}
  const type=$('#ncType').value;
  const inv=$('#ncInv').value;
  const billing={legalName:name,afm:val('ncAfm')||'—',doy:val('ncDoy')||'Λευκάδας',gemi:val('ncGemi')||'',addr:{street:val('ncBStreet'),city:val('ncBCity')||'—',postal:val('ncBPostal')},invoiceType:inv};
  let del;
  if($('#ncSame').checked){
    del={label:'Κύρια διεύθυνση',name,phone:val('ncMobile')||val('ncPhone'),addr:{street:billing.addr.street,city:billing.addr.city,postal:billing.addr.postal},zone:billing.addr.city,hours:'',notes:'',primary:true};
  } else {
    del={label:'Κύρια διεύθυνση',name:val('ncDName')||name,phone:val('ncDPhone')||val('ncPhone'),addr:{street:val('ncDStreet'),city:val('ncDCity')||'—',postal:val('ncDPostal')},zone:val('ncDCity')||'—',hours:'',notes:val('ncDNotes'),primary:true};
  }
  const terms={payment:$('#ncPay').value,creditLimit:parseInt(val('ncCredit'))||0,priceList:val('ncList')||(type==='pro'?'Χονδρική':'Λιανική'),discount:parseInt(val('ncDisc'))||0,invoiceType:inv};
  CUSTOMERS.unshift({code:nextCode(),name,type,prof:val('ncProf')||'—',afm:billing.afm,phone:val('ncPhone')||'—',mobile:val('ncMobile'),email:val('ncEmail'),area:del.zone||'—',balance:0,tags:type==='pro'?['Νέος','Επαγγελματίας']:['Νέος','Ιδιώτης'],billing,deliveries:[del],terms,notes:val('ncNotes'),orders:[]});
  render();showList();toast('Δημιουργήθηκε πελάτης με μοναδικό κωδικό');
}

function copy(t){navigator.clipboard&&navigator.clipboard.writeText(t);toast('Αντιγράφηκε: '+t);}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1900);}
$$('#typeSeg button').forEach(b=>b.onclick=()=>{$$('#typeSeg button').forEach(x=>x.classList.toggle('on',x===b));render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.getElementById('viewPhone').hidden)backToCust();else if(!document.getElementById('viewCust').hidden||!document.getElementById('viewNew').hidden)showList();}});
render();
<\/script>
</body>

<script type="text/html" class="sec" data-id="order" data-title="Δελτίο Παραγγελίας" data-icon="paper">
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Σταύρακας Α.Ε. — Δελτίο Παραγγελίας (Mockup v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241C14;--ink-2:#312619;--paper:#F5F1E9;--paper-2:#FBF9F4;--card:#fff;
    --line:#E4DCCD;--line-dark:#4A3B2A;--text:#2C2318;--muted:#7C7263;--muted-ink:#B6A88F;
    --teal:#1F6F6B;--teal-soft:#E2EEEC;--amber:#B9762A;--amber-soft:#F4E8D6;
    --walnut:#8A5A3B;--walnut-soft:#EFE3D8;--indigo:#43508C;--indigo-soft:#E3E5F1;
    --slate:#2F6C8F;--slate-soft:#DDEAF1;--green:#2E8B57;--green-soft:#DDEEE3;
    --red:#C0492B;--red-soft:#F4DED6;--radius:13px;
    --shadow:0 1px 2px rgba(36,28,20,.05),0 8px 26px -16px rgba(36,28,20,.22);
    --shadow-lg:0 24px 60px -28px rgba(36,28,20,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",system-ui,sans-serif;color:var(--text);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",monospace}
  input,select,button{font-family:inherit;color:inherit}
  input,select{outline:none}
  ::placeholder{color:#b3a994}

  .topbar{position:sticky;top:0;z-index:30;background:rgba(36,28,20,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-dark);color:var(--paper)}
  .topbar .in{max-width:1300px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px}
  .tb-mark{width:30px;height:30px;border-radius:6px;display:block}
  .tb-name{font-family:"Noto Serif",Georgia,serif;font-weight:700;font-size:17px;color:var(--paper)}
  .tb-tag{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--amber);border-left:1px solid var(--line-dark);padding-left:11px;text-transform:uppercase}
  .tb-sp{flex:1}
  .tb-status{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted-ink);display:flex;align-items:center;gap:7px}
  .tb-dot{width:8px;height:8px;border-radius:99px;background:var(--amber)}
  .btn{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:9px;padding:8px 13px;cursor:pointer;border:1px solid var(--line-dark);background:transparent;color:var(--paper);display:inline-flex;align-items:center;gap:7px;transition:.18s;text-transform:uppercase}
  .btn:hover{background:#352a1c;border-color:var(--amber)}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#fff}
  .btn.primary:hover{background:#a3681f}
  .btn svg{width:14px;height:14px}

  .wrap{max-width:1300px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
  @media(max-width:1080px){.wrap{grid-template-columns:1fr}}
  .doc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .side{display:flex;flex-direction:column;gap:16px;position:sticky;top:78px}
  @media(max-width:1080px){.side{position:static}}

  .doc-head{display:flex;justify-content:space-between;gap:18px;padding:20px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo-lock{display:flex;align-items:center;gap:13px}
  .logo-mark{width:52px;height:52px;flex:none;display:block}
  .logo-name{font-family:"Noto Serif",Georgia,serif;font-weight:700;font-size:22px;color:#1b1b1b;line-height:1}
  .logo-tag{font-family:"Inter";font-weight:600;font-size:8px;letter-spacing:.16em;color:#6f6f6f;margin-top:6px}
  .doc-co{font-size:10.5px;color:var(--muted);text-align:right;line-height:1.7}
  .doc-co b{color:var(--text)}
  .doc-title{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 24px;background:var(--ink);color:var(--paper);flex-wrap:wrap}
  .doc-title h1{font-family:"Manrope";font-weight:800;font-size:19px;letter-spacing:.02em;margin:0}
  .doc-title .meta{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted-ink);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .doc-title .meta b{color:#E7A65A}

  .cust{padding:18px 24px;border-bottom:1px solid var(--line);background:var(--paper-2)}
  .cust-search{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .cust-search .field{flex:1;min-width:220px;position:relative}
  .cust-search input{width:100%;padding:11px 13px 11px 38px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
  .cust-search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
  .mini{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:600;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--text);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:.15s}
  .mini:hover{border-color:var(--teal);color:var(--teal)}
  .mini svg{width:13px;height:13px}
  .cust-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 16px}
  @media(max-width:560px){.cust-grid{grid-template-columns:1fr 1fr}}
  .fld label{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .fld input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
  .cust-badges{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;min-height:4px}
  .badge{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}
  .b-teal{background:var(--teal-soft);color:var(--teal)}.b-amber{background:var(--amber-soft);color:var(--amber)}
  .b-indigo{background:var(--indigo-soft);color:var(--indigo)}.b-red{background:var(--red-soft);color:var(--red)}
  .b-green{background:var(--green-soft);color:var(--green)}.b-slate{background:var(--slate-soft);color:var(--slate)}

  .sec-h{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 8px}
  .sec-h h2{font-family:"Manrope";font-weight:700;font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
  .sec-h h2 small{font-family:"JetBrains Mono";font-weight:600;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl thead th{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--paper-2)}
  .tbl thead th.num{text-align:right}
  .tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .tbl tr.line:hover{background:var(--paper-2)}
  .tbl input,.tbl select{border:1px solid transparent;background:transparent;border-radius:7px;padding:7px 8px;font-size:13px;width:100%}
  .tbl input:focus,.tbl select:focus{border-color:var(--teal);background:#fff}
  .tbl .num input{text-align:right;font-family:"JetBrains Mono",monospace}
  .c-idx{width:24px;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:11px;text-align:center;padding-top:13px}
  .c-item{min-width:210px}
  .code{font-family:"JetBrains Mono",monospace;font-weight:600}
  .stockbadge{font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:5px;padding-left:8px}
  .fulfilbadge{font-family:"JetBrains Mono",monospace;font-size:9.5px;margin-top:3px;padding-left:8px;display:flex;gap:8px;flex-wrap:wrap}
  .fb{display:inline-flex;gap:4px;align-items:center}
  .sdot{width:7px;height:7px;border-radius:99px;flex:none}
  .c-unit{width:80px}.c-qty{width:74px}.c-price{width:86px}.c-val{width:96px}
  .val{font-family:"JetBrains Mono",monospace;font-weight:700;text-align:right;padding:7px 8px}
  .c-act{width:60px;text-align:center;white-space:nowrap;padding-top:10px}
  .iconbtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;display:inline-grid;place-items:center;color:var(--muted);transition:.15s;vertical-align:middle}
  .iconbtn:hover{border-color:var(--teal);color:var(--teal)}
  .iconbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .iconbtn.del:hover{border-color:var(--red);color:var(--red)}
  .iconbtn svg{width:14px;height:14px}
  .detail td{background:#FCFAF4;padding:0}
  .detail .in{padding:12px 16px 14px 42px;display:flex;flex-wrap:wrap;gap:13px;align-items:flex-end}
  .dim{display:flex;flex-direction:column;gap:4px}
  .dim label{font-family:"JetBrains Mono",monospace;font-size:9.5px;text-transform:uppercase;color:var(--muted)}
  .dim input{width:80px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;background:#fff;font-family:"JetBrains Mono",monospace;text-align:right}
  .attach-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip-file{font-family:"JetBrains Mono",monospace;font-size:10.5px;background:var(--teal-soft);color:var(--teal);padding:5px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}
  .chip-file svg{width:12px;height:12px}
  .addline{margin:8px 24px 18px;display:inline-flex;gap:8px;align-items:center;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;color:var(--teal);background:var(--teal-soft);border:1px dashed var(--teal);border-radius:10px;padding:9px 15px;cursor:pointer}
  .addline:hover{background:#d3e6e3}.addline svg{width:15px;height:15px}

  /* deliveries */
  .deliv{padding:4px 24px 8px;border-top:1px solid var(--line);background:var(--paper-2)}
  .batch{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
  .batch-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .batch-no{font-family:"Manrope";font-weight:800;font-size:14px}
  .batch-h .sel-zone{font-family:"JetBrains Mono",monospace;font-size:11px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--slate-soft);color:var(--slate);font-weight:700}
  .batch-h input[type=date]{font-family:"JetBrains Mono",monospace;font-size:11px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff}
  .batch-h .sp{flex:1}
  .bstatus{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;padding:5px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
  .modeseg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:3px}
  .modeseg button{border:0;background:transparent;font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;color:var(--muted);padding:5px 9px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .modeseg button svg{width:12px;height:12px}
  .modeseg button.on[data-m=delivery]{background:var(--slate);color:#fff}
  .modeseg button.on[data-m=pickup]{background:var(--green);color:#fff}
  .pickpoint{font-family:"JetBrains Mono",monospace;font-size:11px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--green-soft);color:var(--green);font-weight:700}
  .bmoney.pick{color:var(--green);font-weight:700}
  .order-mode{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
  .order-mode .seg2{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
  .order-mode .seg2 button{border:0;background:transparent;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;color:var(--muted);padding:7px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .order-mode .seg2 button.on{background:var(--ink);color:var(--paper)}
  .order-mode .seg2 button svg{width:13px;height:13px}
  .alloc-mode{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .alloc-mode button{flex:1;min-width:170px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-family:"Manrope";font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text)}
  .alloc-mode button.on{border-color:var(--ink);box-shadow:0 0 0 2px rgba(36,28,20,.12) inset}
  .alloc-mode button svg{width:16px;height:16px}
  .batch-items{padding:8px 15px;font-size:12.5px}
  .bi{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
  .bi:last-child{border-bottom:0}
  .bi .q{font-family:"JetBrains Mono",monospace;font-weight:600}
  .batch-f{padding:11px 15px;background:var(--paper-2);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bmoney{font-family:"JetBrains Mono",monospace;font-size:12px}
  .bmoney b{color:var(--text);font-weight:700}
  .bcap{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted)}
  .bcap .bar{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .bcap .bar i{display:block;height:100%;border-radius:99px}
  .batch-btns{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:4px}
  .newdeliv{margin:10px 0 16px;display:inline-flex;gap:8px;align-items:center;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;color:var(--slate);background:var(--slate-soft);border:1px dashed var(--slate);border-radius:10px;padding:10px 16px;cursor:pointer}
  .newdeliv:hover{filter:brightness(.97)}.newdeliv svg{width:15px;height:15px}

  .doc-foot{padding:13px 24px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .handnote{font-family:"Noto Serif",serif;font-style:italic;color:var(--teal);font-size:16px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel h3{font-family:"Manrope";font-weight:700;font-size:13.5px;margin:0;padding:13px 16px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
  .panel h3 .pi{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
  .panel h3 .pi svg{width:15px;height:15px}
  .panel .body{padding:14px 16px}
  .prow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:5px 0}
  .prow .k{color:var(--muted)}
  .prow .v{font-family:"JetBrains Mono",monospace;font-weight:600}
  .prow.big .v{font-family:"Manrope";font-weight:800;font-size:15px}
  .prog{margin:4px 0 10px}
  .prog .lab{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);margin-bottom:5px}
  .prog .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .prog .bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
  .divider{height:1px;background:var(--line);margin:10px 0}
  .toggle{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
  .sw{width:38px;height:21px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex:none}
  .sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:99px;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sw.on{background:var(--teal)}.sw.on i{left:19px}

  .modal{position:fixed;inset:0;background:rgba(36,28,20,.6);backdrop-filter:blur(3px);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);max-width:560px;width:100%;overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
  .modal .mh{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mh h3{font-family:"Manrope";font-weight:800;font-size:17px;margin:0}
  .modal .mc{padding:18px 20px;overflow:auto}
  .modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .xbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);display:grid;place-items:center}
  .btn2{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;padding:9px 15px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text)}
  .btn2.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  #sketchCanvas,#sigCanvas{width:100%;height:240px;border:1px dashed var(--line);border-radius:10px;background:#FCFAF4;touch-action:none;cursor:crosshair}
  .alloc-grid{display:grid;grid-template-columns:1fr 90px 110px;gap:8px 12px;align-items:center;font-size:13px}
  .alloc-grid .hd{font-family:"JetBrains Mono",monospace;font-size:9.5px;text-transform:uppercase;color:var(--muted)}
  .alloc-grid input{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-family:"JetBrains Mono",monospace;text-align:right;width:100%}
  .alloc-head{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .alloc-head .f{flex:1;min-width:150px}
  .alloc-head label{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .alloc-head select,.alloc-head input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;background:#fff}

  .receipt .rh{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px}
  .receipt table{width:100%;border-collapse:collapse;margin:8px 0}
  .receipt th,.receipt td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
  .receipt th.n,.receipt td.n{text-align:right;font-family:"JetBrains Mono",monospace}
  .receipt .rt{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
  .receipt .rt.g{font-weight:800;font-size:17px;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}

  .hint{font-size:11px;color:var(--muted);padding:0 24px 16px;display:flex;gap:8px;align-items:flex-start}
  .hint svg{width:14px;height:14px;color:var(--amber);flex:none;margin-top:1px}

  @media print{.topbar,.side,.addline,.newdeliv,.cust-search,.c-act,.batch-btns,.hint{display:none!important}body{background:#fff}.wrap{display:block;max-width:100%;padding:0}.doc{border:0;box-shadow:none}}
</style>
</head>
