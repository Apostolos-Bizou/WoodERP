const TODAY=new Date(2026,5,13);
$('#docDate').textContent=dmy(TODAY);

//// LINES (ordered) ////
function lineState(){ // read rows -> array
  return [...$$('#lineBody tr.line')].map(tr=>{
    const code=tr.querySelector('.code').value.trim();const p=byCode(code);
    return {id:+tr.dataset.id, code, name:p?p.name:code, unit:tr.querySelector('.unit').value,
      qty:parseFloat(tr.querySelector('.qty').value)||0, price:parseFloat(tr.querySelector('.price').value)||0,
      kg:parseFloat(tr.dataset.kg)||0, loc:tr.dataset.loc||'—', who:tr.dataset.who||'—', special:tr.dataset.special==='1'};
  });
}
function allocated(lineId){let q=0;deliveries.forEach(d=>d.items.forEach(it=>{if(it.lineId===lineId)q+=it.qty;}));return q;}
function deliveredQty(lineId){let q=0;deliveries.forEach(d=>{if(d.status==='delivered'||d.status==='paid')d.items.forEach(it=>{if(it.lineId===lineId)q+=it.qty;});});return q;}

function addLine(pref){
  lineSeq++;const tr=document.createElement('tr');tr.className='line';tr.dataset.id=lineSeq;
  tr.innerHTML=`<td class="c-idx"></td>
   <td class="c-item"><input class="code" list="prodList" placeholder="κωδικός ή περιγραφή…" autocomplete="off"><div class="stockbadge" style="display:none"></div><div class="fulfilbadge"></div></td>
   <td class="c-unit"><select class="unit"><option>ΤΕΜ</option><option>Μ</option><option>Μ²</option><option>Μ³</option><option>ΠΑΚ</option></select></td>
   <td class="c-qty num"><input class="qty" type="number" min="0" step="0.01" value="${pref?pref.qty:''}" placeholder="0"></td>
   <td class="c-price num"><input class="price" type="number" min="0" step="0.01" placeholder="0,00"></td>
   <td class="c-val"><div class="val">0,00</div></td>
   <td class="c-act"><button class="iconbtn ruler" title="Custom διαστάσεις" onclick="toggleDetail(${lineSeq})"><svg><use href="#s-ruler"/></svg></button><button class="iconbtn del" title="Διαγραφή" onclick="delLine(${lineSeq})"><svg><use href="#s-trash"/></svg></button></td>`;
  $('#lineBody').appendChild(tr);
  const code=tr.querySelector('.code');
  code.addEventListener('input',()=>onCode(tr));code.addEventListener('change',()=>onCode(tr));
  tr.querySelector('.qty').addEventListener('input',recompute);
  tr.querySelector('.price').addEventListener('input',recompute);
  tr.querySelector('.unit').addEventListener('change',recompute);
  if(pref){code.value=pref.code+' '+pref.name;onCode(tr);}
  renumber();recompute();if(!pref)code.focus();return tr;
}
function onCode(tr){
  const p=byCode(tr.querySelector('.code').value);const badge=tr.querySelector('.stockbadge');
  if(p){tr.querySelector('.unit').value=p.unit;if(!tr.querySelector('.price').value)tr.querySelector('.price').value=p.price.toFixed(2);
    badge.style.display='flex';let col,txt;
    if(p.special){col='var(--red)';txt='Special · κατά παραγγελία';}
    else if(p.stock<=15){col='var(--amber)';txt='Χαμηλό: '+p.stock+' · '+p.loc+' ('+p.who+')';}
    else{col='var(--green)';txt='Απόθεμα '+p.stock+' · '+p.loc+' ('+p.who+')';}
    badge.innerHTML=`<span class="sdot" style="background:${col}"></span>${txt}`;
    tr.dataset.kg=p.kg;tr.dataset.loc=p.loc;tr.dataset.who=p.who;tr.dataset.special=p.special?'1':'';
  }else{const v=tr.querySelector('.code').value.trim();
    if(v){badge.style.display='flex';badge.innerHTML='<span class="sdot" style="background:var(--indigo)"></span>Νέος/προσωρινός κωδικός';tr.dataset.kg=5;tr.dataset.loc='—';tr.dataset.who='—';tr.dataset.special='1';}
    else badge.style.display='none';}
  recompute();
}
function delLine(id){const tr=$(`tr[data-id="${id}"]`);const det=$(`tr.detail[data-for="${id}"]`);if(det)det.remove();tr.remove();renumber();recompute();}
function renumber(){let i=0;$$('#lineBody tr.line').forEach(tr=>{i++;tr.querySelector('.c-idx').textContent=i;});}
function toggleDetail(id){let det=$(`tr.detail[data-for="${id}"]`);if(det){det.remove();$(`tr[data-id="${id}"] .ruler`).classList.remove('on');return;}
  const tr=$(`tr[data-id="${id}"]`);det=document.createElement('tr');det.className='detail';det.dataset.for=id;
  det.innerHTML=`<td colspan="7"><div class="in">
    <div class="dim"><label>Μήκος (cm)</label><input type="number" placeholder="—"></div>
    <div class="dim"><label>Πλάτος (cm)</label><input type="number" placeholder="—"></div>
    <div class="dim"><label>Πάχος (mm)</label><input type="number" placeholder="—"></div>
    <div class="dim" style="flex:1;min-width:150px"><label>Σημείωση / υλικό</label><input placeholder="π.χ. δρυς, λούστρο…" style="width:100%"></div>
    <div class="attach-row"><button class="mini" onclick="openSketch(${id})"><svg><use href="#s-pen"/></svg> Σχέδιο</button>
      <button class="mini" onclick="this.parentNode.querySelector('.fileinp').click()"><svg><use href="#s-clip"/></svg> Αρχείο</button>
      <input type="file" class="fileinp" hidden onchange="fileAttached(${id},this)"><span class="att-chips" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
  </div></td>`;
  tr.after(det);tr.querySelector('.ruler').classList.add('on');
}
function fileAttached(id,inp){if(!inp.files.length)return;const c=document.createElement('span');c.className='chip-file';c.innerHTML=`<svg><use href="#s-clip"/></svg>${inp.files[0].name}`;$(`tr.detail[data-for="${id}"] .att-chips`).appendChild(c);}

//// SKETCH / SIGN ////
let curSketchLine=null;
function setupCanvas(id){const cv=document.getElementById(id);const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;const ctx=cv.getContext('2d');ctx.scale(2,2);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#2C2318';let dr=false,px,py;const pos=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-b.left,t.clientY-b.top];};const st=e=>{dr=true;[px,py]=pos(e);e.preventDefault();};const mv=e=>{if(!dr)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();[px,py]=[x,y];e.preventDefault();};const en=()=>dr=false;cv.onmousedown=st;cv.onmousemove=mv;window.addEventListener('mouseup',en);cv.ontouchstart=st;cv.ontouchmove=mv;cv.ontouchend=en;}
function clearCanvas(id){const cv=document.getElementById(id);cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}
function openSketch(id){curSketchLine=id;$('#sketchModal').classList.add('show');setTimeout(()=>{setupCanvas('sketchCanvas');clearCanvas('sketchCanvas');},30);}
function saveSketch(){const chips=$(`tr.detail[data-for="${curSketchLine}"] .att-chips`);if(chips){const c=document.createElement('span');c.className='chip-file';c.innerHTML='<svg><use href="#s-pen"/></svg>σκαρίφημα.png';chips.appendChild(c);}closeModal('sketchModal');}
let curSigBatch=null;
function openSig(bid){curSigBatch=bid;$('#sigModal').classList.add('show');setTimeout(()=>{setupCanvas('sigCanvas');clearCanvas('sigCanvas');},30);}
function saveSig(){const d=deliveries.find(x=>x.id===curSigBatch);if(d)d.sig=true;closeModal('sigModal');renderBatches();}
function closeModal(id){document.getElementById(id).classList.remove('show');}

//// CUSTOMER ////
$('#custSearch').addEventListener('change',function(){const name=this.value.split(' · ')[0].trim();const c=CUSTOMERS.find(x=>x.name===name||x.name===this.value);if(c)fillCustomer(c);});
function fillCustomer(c){$('#cName').value=c.name;$('#cJob').value=c.job;$('#cAfm').value=c.afm;$('#cPhone').value=c.phone;$('#cAddr').value=c.addr;$('#cZone').value=c.zone;
  const b=$('#custBadges');b.innerHTML='';const tc=c.tier==='Χονδρική'?'b-indigo':c.tier==='Επαγγελματίας'?'b-teal':'b-amber';
  b.insertAdjacentHTML('beforeend',`<span class="badge ${tc}">${c.tier}</span>`);
  if(c.balance<0)b.insertAdjacentHTML('beforeend',`<span class="badge b-red">Υπόλοιπο ${eur(c.balance)}</span>`);
  else if(c.balance>0)b.insertAdjacentHTML('beforeend',`<span class="badge b-green">Προκαταβολή ${eur(c.balance)}</span>`);
  else b.insertAdjacentHTML('beforeend',`<span class="badge b-green">Ενήμερος</span>`);
  b.insertAdjacentHTML('beforeend',`<span class="badge b-slate">Έδρα: ${c.zone}</span>`);
  window._cust=c;recompute();
}
function loadUsual(){const c=window._cust||CUSTOMERS[0];if(!window._cust)fillCustomer(c);
  $('#lineBody').innerHTML='';$$('tr.detail').forEach(x=>x.remove());deliveries=[];
  (c.usual||[]).forEach(([code,qty])=>{const p=byCode(code);if(p)addLine({code:p.code,name:p.name,qty});});
  if(!c.usual||!c.usual.length)addLine();renderBatches();recompute();}
function newCustomer(){['#cName','#cJob','#cAfm','#cPhone','#cAddr','#cZone'].forEach(s=>$(s).value='');$('#custBadges').innerHTML='<span class="badge b-amber">Νέος πελάτης</span>';window._cust=null;$('#cName').focus();}

//// DELIVERIES ////
function openAlloc(){
  const lines=lineState().filter(l=>l.code&&l.qty>0);
  if(!lines.length){alert('Πρόσθεσε πρώτα είδη στην παραγγελία.');return;}
  const g=$('#allocGrid');g.innerHTML='<div class="hd">Είδος</div><div class="hd" style="text-align:right">Υπόλοιπο</div><div class="hd" style="text-align:right">Σε αυτή τη δόση</div>';
  lines.forEach(l=>{const rem=l.qty-allocated(l.id);
    g.insertAdjacentHTML('beforeend',`<div>${l.name}<div class="mono" style="font-size:10px;color:var(--muted)">${l.code}</div></div>
      <div class="mono" style="text-align:right;color:${rem>0?'var(--amber)':'var(--muted)'}">${(+rem.toFixed(2))} ${l.unit}</div>
      <div><input data-line="${l.id}" type="number" min="0" max="${rem}" step="0.01" value="${rem>0?(+rem.toFixed(2)):0}"></div>`);
  });
  $('#allocZone').innerHTML=DELIV_ZONES.map(z=>`<option>${z}</option>`).join('');
  $('#allocPickup').innerHTML=PICKUP_POINTS.map(p=>`<option>${p}</option>`).join('');
  const z=(window._cust&&window._cust.zone&&DELIV_ZONES.includes(window._cust.zone))?window._cust.zone:'Βασιλική';
  $('#allocZone').value=z;
  $('#allocDate').value='2026-06-13';
  setAllocMode(defaultMode);
  $('#allocModal').classList.add('show');
}
function createDelivery(){
  const lines=lineState();const items=[];
  $$('#allocGrid input[data-line]').forEach(inp=>{const q=parseFloat(inp.value)||0;if(q>0){const l=lines.find(x=>x.id===+inp.dataset.line);if(l)items.push({lineId:l.id,code:l.code,name:l.name,unit:l.unit,price:l.price,kg:l.kg,who:l.who,qty:q});}});
  if(!items.length){alert('Όρισε ποσότητες για τη δόση.');return;}
  delSeq++;deliveries.push({id:delSeq,no:deliveries.length+1,mode:allocMode,zone:$('#allocZone').value,pbuild:$('#allocPickup').value,date:$('#allocDate').value,status:'planned',items,sig:false,photo:false});
  closeModal('allocModal');renderBatches();recompute();
}
function delDelivery(id){deliveries=deliveries.filter(d=>d.id!==id);deliveries.forEach((d,i)=>d.no=i+1);renderBatches();recompute();}
function setBatchZone(id,z){const d=deliveries.find(x=>x.id===id);if(d){d.zone=z;renderBatches();recompute();}}
function setBatchDate(id,v){const d=deliveries.find(x=>x.id===id);if(d)d.date=v;}
function setBatchMode(id,m){const d=deliveries.find(x=>x.id===id);if(d){d.mode=m;renderBatches();recompute();}}
function setBatchPickup(id,p){const d=deliveries.find(x=>x.id===id);if(d){d.pbuild=p;renderBatches();recompute();}}
function setDefaultMode(m){defaultMode=m;$('#omDeliv').classList.toggle('on',m==='delivery');$('#omPick').classList.toggle('on',m==='pickup');}
function setAllocMode(m){allocMode=m;$('#amDeliv').classList.toggle('on',m==='delivery');$('#amPick').classList.toggle('on',m==='pickup');$('#allocZoneWrap').style.display=m==='delivery'?'':'none';$('#allocPickWrap').style.display=m==='pickup'?'':'none';}
function advance(id,target){const d=deliveries.find(x=>x.id===id);if(!d)return;d.status=target;renderBatches();recompute();}
function photoBatch(id){const d=deliveries.find(x=>x.id===id);if(d){d.photo=true;renderBatches();}}

function batchWeight(d){return d.items.reduce((s,it)=>s+it.qty*(it.kg||0),0);}
function batchNet(d){return d.items.reduce((s,it)=>s+it.qty*it.price,0);}
function batchFreight(d){if((d.mode||'delivery')==='pickup')return 0;const z=ZONES[d.zone]||{base:0};return z.base+Math.ceil(batchWeight(d)/1000)*8;}

function renderBatches(){
  const wrap=$('#batches');wrap.innerHTML='';
  if(!deliveries.length){wrap.innerHTML='<div class="prow" style="padding:6px 0;color:var(--muted);font-size:12.5px">Καμία παράδοση ακόμη — όλη η παραγγελία είναι σε εκκρεμότητα. Πάτησε «Νέα παράδοση».</div>';return;}
  deliveries.forEach(d=>{
    const si=ST.findIndex(s=>s.k===d.status),s=ST[si];
    const net=batchNet(d),fr=batchFreight(d),w=batchWeight(d),pct=Math.min(w/TRUCK_CAP*100,100);
    const eta=new Date(d.date+'T00:00');
    let items=d.items.map(it=>`<div class="bi"><span>${it.name} <span class="mono" style="color:var(--muted);font-size:11px">${it.code}</span></span><span class="q">${(+it.qty.toFixed(2))} ${it.unit}</span></div>`).join('');
    const mode=d.mode||'delivery';
    const etaStr=eta.toLocaleDateString('el-GR',{weekday:'short',day:'2-digit',month:'2-digit'});
    const capColor=w>TRUCK_CAP?'var(--red)':w>TRUCK_CAP*0.8?'var(--amber)':'var(--teal)';
    let zoneOpts=DELIV_ZONES.map(z=>`<option ${z===d.zone?'selected':''}>${z}</option>`).join('');
    let pickOpts=PICKUP_POINTS.map(p=>`<option ${p===(d.pbuild||PICKUP_POINTS[0])?'selected':''}>${p}</option>`).join('');
    const loadLbl=mode==='pickup'?'Ετοιμάστηκε':'Φορτώθηκε';
    const delivLbl=mode==='pickup'?'Παρελήφθη':'Παραδόθηκε';
    let btns=`
      <button class="mini" onclick="advance(${d.id},'loaded')" ${si>=1?'style="opacity:.5"':''}><svg><use href="#s-truck"/></svg> ${loadLbl}</button>
      <button class="mini" onclick="photoBatch(${d.id})"><svg><use href="#s-cam"/></svg> Φωτό${d.photo?' ✓':''}</button>
      <button class="mini" onclick="openSig(${d.id})"><svg><use href="#s-pen"/></svg> Υπογραφή${d.sig?' ✓':''}</button>
      <button class="mini" onclick="advance(${d.id},'delivered')" ${si>=2?'style="opacity:.5"':''}><svg><use href="#s-check"/></svg> ${delivLbl}</button>
      <button class="mini" onclick="advance(${d.id},'paid')" ${si>=3?'style="opacity:.5"':''}><svg><use href="#s-wallet"/></svg> Πληρώθηκε</button>
      <button class="mini" onclick="openBatchBill(${d.id})"><svg><use href="#s-print"/></svg> Λογαριασμός</button>
      <button class="mini" style="margin-left:auto" onclick="delDelivery(${d.id})"><svg><use href="#s-trash"/></svg></button>`;
    const dest = mode==='delivery'
      ? `<select class="sel-zone" onchange="setBatchZone(${d.id},this.value)">${zoneOpts}</select>`
      : `<select class="pickpoint" onchange="setBatchPickup(${d.id},this.value)">${pickOpts}</select>`;
    const foot = mode==='delivery'
      ? `<span class="bmoney">Μεταφορικά: <b>${eur(fr)}</b></span>
         <span class="bmoney" style="color:var(--muted)">ETA ${etaStr}</span>
         <span class="bcap">${Math.round(w)}kg<span class="bar"><i style="width:${pct}%;background:${capColor}"></i></span>${Math.round(w/TRUCK_CAP*100)}%</span>`
      : `<span class="bmoney pick">🧍 Παραλαβή από τον πελάτη — χωρίς μεταφορικά</span>
         <span class="bmoney" style="color:var(--muted)">Σημείο: <b>${d.pbuild||PICKUP_POINTS[0]}</b></span>
         <span class="bmoney" style="color:var(--muted)">Έτοιμη: ${etaStr} · ${Math.round(w)}kg</span>`;
    wrap.insertAdjacentHTML('beforeend',`<div class="batch">
      <div class="batch-h">
        <span class="batch-no">Παράδοση #${d.no}</span>
        <span class="modeseg">
          <button data-m="delivery" class="${mode==='delivery'?'on':''}" onclick="setBatchMode(${d.id},'delivery')">${ICO_TRUCK} Διανομή</button>
          <button data-m="pickup" class="${mode==='pickup'?'on':''}" onclick="setBatchMode(${d.id},'pickup')">${ICO_PICK} Παραλαβή</button>
        </span>
        ${dest}
        <input type="date" value="${d.date}" onchange="setBatchDate(${d.id},this.value)">
        <span class="sp"></span>
        <span class="bstatus" style="background:${s.bg};color:${s.c}">${s.t}</span>
      </div>
      <div class="batch-items">${items}</div>
      <div class="batch-f">
        <span class="bmoney">Αξία: <b>${eur(net)}</b></span>
        ${foot}
        <div class="batch-btns">${btns}</div>
      </div>
    </div>`);
  });
}

//// RECOMPUTE (rollup + stock + destinations) ////
function recompute(){
  const lines=lineState();let ordered=0;
  lines.forEach(l=>{const v=l.qty*l.price;ordered+=v;const tr=$(`tr[data-id="${l.id}"]`);if(tr)tr.querySelector('.val').textContent=eur(v).replace(' €','');
    // fulfil badge
    const alloc=allocated(l.id),deliv=deliveredQty(l.id),rem=l.qty-alloc,sched=alloc-deliv;
    const fb=tr?tr.querySelector('.fulfilbadge'):null;
    if(fb){if(l.qty>0&&l.code){fb.innerHTML=`<span class="fb" style="color:var(--green)"><span class="sdot" style="background:var(--green)"></span>Παραδ. ${(+deliv.toFixed(2))}</span>`+(sched>0?`<span class="fb" style="color:var(--amber)"><span class="sdot" style="background:var(--amber)"></span>Προγρ. ${(+sched.toFixed(2))}</span>`:'')+(rem>0.001?`<span class="fb" style="color:var(--red)"><span class="sdot" style="background:var(--red)"></span>Υπόλ. ${(+rem.toFixed(2))}</span>`:`<span class="fb" style="color:var(--teal)">✓ πλήρες</span>`);}else fb.innerHTML='';}
  });
  let deliv=0,paid=0;
  deliveries.forEach(d=>{const net=batchNet(d);if(d.status==='delivered'||d.status==='paid')deliv+=net;if(d.status==='paid')paid+=net;});
  const remain=Math.max(ordered-deliv,0),collect=Math.max(deliv-paid,0);
  $('#rOrdered').textContent=eur(ordered);$('#rDeliv').textContent=eur(deliv);$('#rRemain').textContent=eur(remain);
  $('#rPaid').textContent=eur(paid);$('#rCollect').textContent=eur(collect);
  const dp=ordered?deliv/ordered*100:0,pp=ordered?paid/ordered*100:0;
  $('#delivBar').style.width=dp+'%';$('#delivPct').textContent=Math.round(dp)+'%';
  $('#paidBar').style.width=pp+'%';$('#paidPct').textContent=Math.round(pp)+'%';
  // status text
  $('#statusText').textContent=!deliveries.length?'Σε εκκρεμότητα':dp>=100?'Ολοκληρώθηκε':'Μερική εκτέλεση '+Math.round(dp)+'%';
  // destinations
  const db=$('#destBody');
  if(!deliveries.length){db.innerHTML='<div class="prow"><span class="k">Δημιουργήστε παράδοση.</span></div>';}
  else{db.innerHTML='';const zmap={};deliveries.forEach(d=>{const pk=(d.mode||'delivery')==='pickup';const key=pk?('Παραλαβή · '+(d.pbuild||'κατάστημα')):d.zone;zmap[key]=zmap[key]||{w:0,n:0,pick:pk};zmap[key].w+=batchWeight(d);zmap[key].n++;});
    Object.keys(zmap).forEach(z=>{const pk=zmap[z].pick;db.insertAdjacentHTML('beforeend',`<div class="prow"><span class="k" style="display:flex;align-items:center;gap:7px"><svg style="width:14px;height:14px;color:${pk?'var(--green)':'var(--slate)'}"><use href="#s-pin"/></svg>${z}</span><span class="v" style="font-size:11.5px">${zmap[z].n} δόση(εις) · ${Math.round(zmap[z].w)}kg</span></div>`);});
    if(Object.keys(zmap).length>1)db.insertAdjacentHTML('beforeend',`<div class="prow" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span class="k">Διαφορετικοί προορισμοί</span><span class="v b-slate" style="background:var(--slate-soft);color:var(--slate);padding:2px 8px;border-radius:99px">${Object.keys(zmap).length}</span></div>`);
  }
  // stock
  const sb=$('#stockBody');const rows=lines.filter(l=>l.code);
  if(!rows.length)sb.innerHTML='<div class="prow"><span class="k">Προσθέστε είδη.</span></div>';
  else{sb.innerHTML='';const who={};rows.forEach(l=>{let col=l.special?'var(--red)':(byCode(l.code)&&byCode(l.code).stock<=15?'var(--amber)':'var(--green)');let tag=l.special?'Special':(byCode(l.code)&&byCode(l.code).stock<=15?'Χαμηλό':'OK');
      sb.insertAdjacentHTML('beforeend',`<div class="prow"><span class="k" style="display:flex;align-items:center;gap:7px"><span class="sdot" style="background:${col}"></span>${l.name}</span><span class="v mono" style="font-size:11px">${tag}</span></div>`);
      if(l.who&&l.who!=='—')who[l.who]=1;});
    const wl=Object.keys(who);if(wl.length)sb.insertAdjacentHTML('beforeend',`<div class="prow" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span class="k">Υπεύθυνοι χώρων</span><span class="v" style="font-size:11.5px">${wl.join(', ')}</span></div>`);}
}

//// BILLS ////
function billHTML(title,sub,lines,freight){
  const disc=0;const net=sub;const vat=(net+freight)*VAT,total=net+freight+vat;
  let rows=lines.map((l,i)=>`<tr><td class="n">${i+1}</td><td>${l.name} <span class="mono" style="color:var(--muted);font-size:10px">${l.code||''}</span></td><td class="n">${(+l.qty.toFixed(2))} ${l.unit}</td><td class="n">${eur(l.price)}</td><td class="n">${eur(l.qty*l.price)}</td></tr>`).join('');
  return `<div class="receipt">
    <div class="rh"><div><div style="font-family:'Noto Serif',serif;font-weight:700;font-size:20px">Σταύρακας Α.Ε.</div><div style="font-size:10px;color:var(--muted)">Εμπόριο &amp; Κατεργασία Ξύλου · Λευκάδα · ΑΦΜ 081585045</div></div>
    <div style="text-align:right;font-size:11px;font-family:'JetBrains Mono',monospace">${title}<br>Αρ. ${$('#docNo').textContent}<br>${$('#docDate').textContent}</div></div>
    <div style="font-size:12px;margin-bottom:6px"><b>${$('#cName').value||'—'}</b> · ${$('#cPhone').value||''} · ΑΦΜ ${$('#cAfm').value||'—'}</div>
    <table><thead><tr><th class="n">#</th><th>Είδος</th><th class="n">Ποσότ.</th><th class="n">Τιμή</th><th class="n">Αξία</th></tr></thead><tbody>${rows||'<tr><td colspan=5 style="color:var(--muted)">—</td></tr>'}</tbody></table>
    <div class="rt"><span>Αξία ειδών</span><span>${eur(net)}</span></div>
    <div class="rt"><span>Μεταφορικά</span><span>${eur(freight)}</span></div>
    <div class="rt"><span>ΦΠΑ 24%</span><span>${eur(vat)}</span></div>
    <div class="rt g"><span>ΣΥΝΟΛΟ</span><span>${eur(total)}</span></div>
    <div style="font-size:11px;color:var(--muted);margin-top:10px;font-style:italic;font-family:'Noto Serif',serif">Για ό,τι έχει σχέση με το ξύλο</div></div>`;
}
function openOrderBill(){const lines=lineState().filter(l=>l.code&&l.qty>0);const sub=lines.reduce((s,l)=>s+l.qty*l.price,0);
  $('#billTitle').textContent='Προσφορά — σύνολο παραγγελίας';$('#billBody').innerHTML=billHTML('ΠΡΟΣΦΟΡΑ (σύνολο)',sub,lines,0);$('#billModal').classList.add('show');}
function openBatchBill(id){const d=deliveries.find(x=>x.id===id);if(!d)return;const sub=batchNet(d);
  $('#billTitle').textContent='Λογαριασμός — Παράδοση #'+d.no+' · '+d.zone;
  $('#billBody').innerHTML=billHTML('ΑΠΟΔΕΙΞΗ · Παράδοση #'+d.no+' · '+d.zone,sub,d.items,batchFreight(d));$('#billModal').classList.add('show');}

 {id:7,order:'2026-000420',cust:'Βλάχος Α.Ε.',zone:'Βόνιτσα',eta:'αύριο 09:00',worker:'nikos',building:'5ο κτίριο',status:'new',photo:false,
   items:[{nm:'Γυψοσανίδα KNAUF 12.5mm',shelf:'Γ3',qty:'30 ΤΕΜ'}]},
];
const ST={new:{t:'Νέο',c:'ts-new'},doing:{t:'Σε εξέλιξη',c:'ts-doing'},loaded:{t:'Φορτώθηκε',c:'ts-loaded'}};
let view='tasos';
const $=s=>document.querySelector(s);
const wOf=id=>WORKERS.find(w=>w.id===id);
const initial=n=>n[0];

// build switcher
const sw=$('#switch');
WORKERS.forEach(w=>{
  const b=document.createElement('button');b.className='rbtn';b.dataset.v=w.id;
  b.innerHTML=`<span class="av" style="background:${w.color}">${initial(w.name)}</span><span><span class="nm">${w.name}</span><br><span class="bl">${w.building}</span></span>`;
  b.onclick=()=>{view=w.id;render();};sw.appendChild(b);
});
const cb=document.createElement('button');cb.className='rbtn coord';cb.dataset.v='coord';
cb.innerHTML=`<span class="av">Σ</span><span><span class="nm">Συντονιστής</span><br><span class="bl">όλα τα κτίρια</span></span>`;
cb.onclick=()=>{view='coord';render();};sw.appendChild(cb);

function setStatus(id,st){const t=TASKS.find(x=>x.id===id);if(t){t.status=st;if(st==='loaded')t.loaded=true;}render();}
function togglePhoto(id){const t=TASKS.find(x=>x.id===id);if(t){t.photo=!t.photo;}render();}

function renderWorker(wid){
  const w=wOf(wid);const mine=TASKS.filter(t=>t.worker===wid);
  const done=mine.filter(t=>t.status==='loaded').length;
  const pct=mine.length?done/mine.length*100:0;
  let cards=mine.map(t=>{
    const s=ST[t.status];const isDone=t.status==='loaded';
    const items=t.items.map(it=>`<div class="it"><span class="shelf">Ράφι ${it.shelf}</span><span class="nm">${it.nm}</span><span class="qt">${it.qty}</span></div>`).join('');
    return `<div class="task ${isDone?'done':''}" style="--c:${w.color}">
      <div class="th"><div class="cust"><b>${t.cust}</b><div class="o">Παρ. ${t.order}</div></div><span class="tstat ${s.c}">${s.t}</span></div>
      <div class="route"><span><svg><use href="#i-pin"/></svg>${t.zone}</span><span><svg><use href="#i-clock"/></svg>${t.eta}</span></div>
      <div class="items">${items}</div>
      <div class="tact">
        <button class="start ${t.status!=='new'?'on':''}" onclick="setStatus(${t.id},'doing')"><svg><use href="#i-play"/></svg> ${t.status==='new'?'Ξεκίνησα':'Σε εξέλιξη'}</button>
        <button class="cam" onclick="togglePhoto(${t.id})" title="Φωτό φορτίου" style="${t.photo?'background:var(--amber);border-color:var(--amber);color:#fff':''}"><svg><use href="#i-cam"/></svg></button>
        <button class="go ${isDone?'done':''}" onclick="setStatus(${t.id},'loaded')"><svg><use href="#i-${isDone?'check':'truck'}"/></svg> ${isDone?'Φορτώθηκε ✓':'Φορτώθηκε'}</button>
      </div>
    </div>`;
  }).join('');
  if(!mine.length)cards=`<div class="empty"><svg><use href="#i-inbox"/></svg><div>Καμία εργασία για σήμερα.</div></div>`;
  return `<div class="phone">
    <div class="notch"></div>
    <div class="whead" style="background:${w.color}">
      <div class="av">${initial(w.name)}</div>
      <div class="who"><b>${w.name}</b><span>Υπεύθυνος · ${w.building}</span></div>
      <div class="cnt"><b>${mine.length-done}</b><span>σε εκκρεμότητα</span></div>
    </div>
    <div class="wbar"><i style="width:${pct}%"></i></div>
    <div class="wbody">
      <div class="daylabel"><span>Οι εργασίες μου σήμερα</span><span>${done}/${mine.length} ✓</span></div>
      ${cards}
    </div>
  </div>`;
}

function renderCoord(){
  const orders=[...new Set(TASKS.map(t=>t.order))];
  const totalT=TASKS.length, loadedT=TASKS.filter(t=>t.status==='loaded').length;
  const readyOrders=orders.filter(o=>TASKS.filter(t=>t.order===o).every(t=>t.status==='loaded')).length;
  let rows=orders.map(o=>{
    const ts=TASKS.filter(t=>t.order===o);const f=ts[0];
    const ready=ts.every(t=>t.status==='loaded');
    const stns=ts.map(t=>{const w=wOf(t.worker);const s=ST[t.status];
      const li=t.items.map(it=>`<div class="li"><span>${it.nm}</span><span class="q">${it.qty}</span></div>`).join('');
      const col=t.status==='loaded'?'var(--green)':t.status==='doing'?'var(--amber)':'var(--slate)';
      return `<div class="stn"><div class="sn"><span class="d" style="background:${col}"></span><b>${w.name}</b><small>${t.building}</small></div>${li}<div class="ss" style="color:${col}">${s.t}${t.photo?' · 📷':''}</div></div>`;
    }).join('');
    return `<div class="ord">
      <div class="oh"><span class="cu">${f.cust}</span>
        <span class="meta"><span>Παρ. ${o}</span><span>📍 ${f.zone}</span><span>⏱ ${f.eta}</span><span>${ts.length} σταθμοί</span></span>
        <span class="ready" style="background:${ready?'var(--green-soft)':'var(--amber-soft)'};color:${ready?'var(--green)':'var(--amber)'}">${ready?'Έτοιμη να φύγει':'Σε εξέλιξη'}</span>
      </div>
      <div class="stations">${stns}</div>
    </div>`;
  }).join('');
  return `<div class="board">
    <div class="bh"><h2><span class="pi"><svg><use href="#i-grid"/></svg></span> Πίνακας Συντονιστή</h2>
      <div class="kpis">
        <div class="kpi"><b>${orders.length}</b>παραγγελίες</div>
        <div class="kpi"><b>${loadedT}/${totalT}</b>εργασίες ✓</div>
        <div class="kpi"><b>${readyOrders}</b>έτοιμες</div>
      </div>
    </div>${rows}</div>`;
}

function render(){
  $$all('.rbtn').forEach(b=>b.classList.toggle('sel',b.dataset.v===view));
  $('#stage').innerHTML = view==='coord'?renderCoord():renderWorker(view);
}
function $$all(s){return document.querySelectorAll(s);}
render();
<\/script>
</body>
</html>

</script>

<script>
const ICONS={
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>',
 crm:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5.8M21 20a6 6 0 0 0-4-5.6"/>',
 paper:'<path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M9 13h6M9 17h6M9 9h2"/>',
 check:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8.5 11l2 2 4-4"/>',
 flow:'<rect x="3" y="4" width="6" height="5" rx="1"/><rect x="15" y="15" width="6" height="5" rx="1"/><path d="M9 6.5h4a2 2 0 0 1 2 2v9"/>',
 book:'<path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M19 6v14"/><path d="M8 8h6M8 11h6"/>'
};
const secs=[...document.querySelectorAll('script.sec')].map(s=>({
  id:s.dataset.id, title:s.dataset.title, icon:s.dataset.icon,
  html:s.textContent.replace(/<\\\/script>/g,'<\/script>')
}));
const app=document.querySelector('.app');
const sidebar=document.getElementById('sidebar');
const nav=document.getElementById('nav'), frame=document.getElementById('frame');
let cur=null;
secs.forEach((sec)=>{
  const a=document.createElement('button');a.className='nav-item';a.dataset.id=sec.id;
  a.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[sec.icon]||''}</svg><span>${sec.title}</span>`;
  a.onclick=()=>show(sec.id);
  nav.appendChild(a);
});
function show(id){
  const sec=secs.find(s=>s.id===id); if(!sec) return; cur=sec;
  frame.srcdoc=sec.html;
  document.getElementById('crumbTitle').textContent=sec.title;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('on',n.dataset.id===id));
  if(window.innerWidth<=880) sidebar.classList.remove('open');
}
function toggleNav(){
  if(window.innerWidth<=880) sidebar.classList.toggle('open');
  else app.classList.toggle('collapsed');
}
document.getElementById('ham').onclick=toggleNav;
window.addEventListener('resize',()=>{
  if(window.innerWidth>880) sidebar.classList.remove('open');
  else app.classList.remove('collapsed');
});
document.getElementById('openTab').onclick=()=>{
  if(!cur) return;
  const b=new Blob([cur.html],{type:'text/html'});
  window.open(URL.createObjectURL(b),'_blank');
};
show(secs[0].id);
</script>
</body>
</html>
